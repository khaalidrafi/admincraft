[package]
name = "admincraft"
version = "0.1.1"
description = "Branded, extensible admin dashboard — thin client for DRF + drf-spectacular backends"
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "admincraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
