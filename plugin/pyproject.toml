[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "admineverywhere"
version = "0.1.2"
description = "Branded, extensible AI admin dashboard: Django plugin that themes a Tauri/Svelte thin client from one brand.json"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Khalid Rafi" }]
dependencies = [
    "Django>=4.2",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
