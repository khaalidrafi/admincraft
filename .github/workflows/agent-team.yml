name: Agent Team Chain

# admincraft — CI agent-team chain, scaffolded by agent-team.el
# (M-x agent-team-setup-project) from templates/agent-team.yml.
# One canonical architecture, proven on khaalidrafi/agent-team.el and
# khaalidrafi/admincraft (Owner orders 2026-10-20 -> 2026-10-21).
#
# Structure per run: test (landing gate) -> probe (seat liveness, never
# gates) -> turn (TG ingest owner-locked -> session restore -> REVIEW phase
# (SEGREGATION LAW: this seat reviews the previous run's pending branch,
# read-only) -> ONE author segment in the preinstalled harness container ->
# session scrub+upload -> branch push + rotation advance; the author branch
# is NEVER merged by its own run) -> finalize (MERGER: resolves the pending
# branch's review verdict and merges ONLY on a different member's APPROVED
# verdict, behind the landing gate -> review record + next-pending write ->
# Jev judgment -> stall accounting -> SELF-DISPATCH while the objective
# is open and KILL-SWITCH is OFF). The team decides how many runs the
# objective takes; the chain stops ONLY on kill switch, objective
# complete, or tests red; a no-progress streak shifts to backoff, never to
# failure. Verdicts mirror to the Owner's Telegram (owner-locked, deduped)
# and this project's Discord channel. GoModel (llmfisher gateway) rides as
# a HEALTH-GATED lane (turn health + finalize Jev). The gateway URL is
# RESOLVED per job (Owner order 2026-10-22): vars.GOMODEL_GATEWAY_URL
# override -> https://ai.khalidrafi.tech -> localhost:8080 -> in-runner
# boot (last resort = no deployment active). DOWN -> lane-fallback law,
# never red. Judgment lane is BINARY: Jev via the gateway when it is up,
# else the chain decides directly (local rules) — no provider chain.
#
# This file is LEAD-OWNED: seats never edit it (brief law #10). Re-scaffold
# it with M-x agent-team-setup-project (refresh = re-run, adoption is
# asked). Slot tokens are filled by the setup command; the blocks already
# inside are the engine's proven defaults.

on:
  # NO push trigger (Lead fix 2026-10-22 ~19:30Z, Owner-visible): every
  # chain commit on ai/main spawned another run — with self-dispatch that
  # doubled the run count every cycle (three concurrent runs observed at
  # 19:07Z). The self-dispatching finalize owns pacing; the hourly cron
  # stays only as the infra-death safety net. All triggers share the
  # concurrency group below, so runs serialize; cancel stays FALSE — a
  # redundant queued run is cheaper than killing an in-flight lane burn.
  schedule:
    # Chain safety net — the self-dispatching finalize owns the pacing;
    # this cron only re-kicks a chain that died infra-level.
    - cron: '17 * * * *'
  workflow_dispatch: {}

concurrency:
  # LITERAL group (Lead fix, night-watch 2026-10-22 ~19:45Z): the
  # ref-expression group failed to serialize push vs dispatch runs in
  # practice (two in_progress at 19:07Z AND again at 19:34Z despite
  # identical resolved refs). A literal string is immune to any
  # ref-resolution quirk. cancel stays FALSE: a redundant queued run
  # is cheaper than killing an in-flight paid lane burn mid-review.
  group: agent-team-chain
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # self-chain: finalize re-dispatches the next turn
  # NO `workflows: write` — GitHub rejects the KEY at workflow-creation
  # time: every run startup-FAILS with zero jobs (agent-team.el runs
  # 39455051426 / 39455277702 evidence). Seats therefore NEVER touch
  # .github/workflows/* (brief law #10: Lead-owned files, cite in chat).

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project deps
        run: |
          pip install -r demo-backend/requirements.txt pytest
          pip install -e plugin
      - name: Landing gate (pytest plugin/tests + manage.py check)
        run: |
          bash .github/scripts/gate.sh

  # Seat-liveness heartbeat (engine shape). One real completion per
  # accountable API seat, direct to the provider. Results land in the run
  # summary; NOTHING here can fail the workflow. The gomodel/Jev lane is
  # health-gated in `turn` + `finalize`; seats go DIRECT to providers here.
  # The Lead may re-point rows at this team's MEMBERS.org after hiring.
  probe:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Probe accountable seats (direct provider keys)
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          GOMODEL_MASTER_KEY: ${{ secrets.GOMODEL_MASTER_KEY }}   # gateway free-offer catalog scan (Owner 2026-10-22)
          GOMODEL_GATEWAY_URL: ${{ vars.GOMODEL_GATEWAY_URL || 'https://ai.khalidrafi.tech' }}
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY"
          echo "## Seat probe — ${GITHUB_SHA::7} (${{ github.event_name }})" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "| seat brain | probe | HTTP | evidence (first 120 chars) |" >> "$SUMMARY"
          echo "|---|---|---|---|" >> "$SUMMARY"

          probe() {
            local name="$1" url="$2" model="$3" key="$4" extra="${5:-}"
            if [ -z "$key" ]; then
              echo "| $name | SKIP | - | key not set in repo secrets |" >> "$SUMMARY"
              return 0
            fi
            local body code
            body=$(mktemp)
            code=$(curl -sS -m 45 -o "$body" -w '%{http_code}' -X POST "$url" \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer $key" $extra \
              -d "{\"model\":\"$model\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with the single word: alive\"}],\"max_tokens\":16}" \
              || echo 000)
            local snippet
            snippet=$(head -c 120 "$body" | tr '\n' ' ' | tr -d '|')
            echo "| $name | $url | $code | \`$snippet\` |" >> "$SUMMARY"
            rm -f "$body"
            sleep 2   # space calls: bursts stress shared free tiers
          }

          probe "openrouter/poolside/laguna-s-2.1:free" \
            "https://openrouter.ai/api/v1/chat/completions" \
            "poolside/laguna-s-2.1:free" "$OPENROUTER_API_KEY"

          probe "groq/qwen3.8-27b" \
            "https://api.groq.com/openai/v1/chat/completions" \
            "qwen/qwen3.8-27b" "$GROQ_API_KEY"

          probe "zai/glm-4.7-flash" \
            "https://api.z.ai/api/paas/v4/chat/completions" \
            "glm-4.7-flash" "$ZAI_API_KEY"

          # BURN-LAW (Owner 2026-10-24 17:01Z): minimax-m3.1-flash is
          # PERSONA NON GRATA — "no hire, no probe, no fallback". The
          # former direct :free probe row and the FIRST_MM live probe
          # are REMOVED (Lead, 10-di, Owner BOOST cycle). The gateway
          # catalog scan stays as deepseek-only evidence:
          if [ -n "$GOMODEL_MASTER_KEY" ]; then
            CATALOG=$(curl -sS -m 30 -H "Authorization: Bearer $GOMODEL_MASTER_KEY" \
              "${GOMODEL_GATEWAY_URL}/v1/models" 2>/dev/null || echo '{}')
            GWD=$(echo "$CATALOG" | jq -r '.data[]?.id' 2>/dev/null | grep -i 'deepseek' | head -5 || true)
            {
              echo ""
              echo "### GoModel gateway free-offer catalog (minimax / deepseek)"
              echo ""
              while IFS= read -r d; do [ -n "$d" ] && echo "- deepseek: \`$d\`"; done <<< "$GWD"
              [ -n "$GWM$GWD" ] || echo "- (no minimax/deepseek ids served by the gateway today)"
            } >> "$SUMMARY"
          else
            echo "" >> "$SUMMARY"
            echo "- GOMODEL_MASTER_KEY not set — gateway catalog scan skipped" >> "$SUMMARY"
          fi

          echo "" >> "$SUMMARY"
          echo "Law: a probe row is evidence of the RUNTIME, not of quality —" >> "$SUMMARY"
          echo "seat ranks live in agent-team/MEMBERS.org." >> "$SUMMARY"
          # Lead fix 2026-10-22: the table went only to the step summary
          # (invisible in logs fetched via API) — echo it to stdout too.
          cat "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/checkout@v4

      - name: Probe codebuddy lane (real CLI in the harness image — Owner order 2026-10-23)
        continue-on-error: true
        env:
          CODEBUDDY_AUTH_TOKEN: ${{ secrets.CODEBUDDY_AUTH_TOKEN }}
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY"
          echo "" >> "$SUMMARY"
          echo "### CodeBuddy lane probe (the lane itself: CLI + token + model)" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          if [ -z "$CODEBUDDY_AUTH_TOKEN" ]; then
            echo "| codebuddy lane | SKIP | - | CODEBUDDY_AUTH_TOKEN not set in repo secrets |" >> "$SUMMARY"
            cat "$SUMMARY" || true
            exit 0
          fi
          # 0) raw network vantage (splits network-blackhole from API/auth trouble)
          NET=$(curl -s -o /dev/null -m 15 -w 'HTTP %{http_code} in %{time_total}s' https://www.codebuddy.ai 2>&1 || echo "connect FAILED")
          # 1) same harness image the turn job uses (gha cache: cheap when warm)
          docker buildx build --load \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -f docker/harness/Dockerfile \
            -t agent-harness:local \
            . > /tmp/harness-build.log 2>&1 || { echo "| codebuddy lane | SKIP | - | harness image build failed (see build log) |" >> "$SUMMARY"; tail -5 /tmp/harness-build.log; cat "$SUMMARY" || true; exit 0; }
          # 2) the EXACT lane invocation from .github/scripts/turn_segment.sh,
          #    shrunk to a ping (--max-turns 2), wrapped in a hard timeout so a
          #    blackhole lane cannot eat the job budget
          docker run --rm --entrypoint bash \
            -e CODEBUDDY_AUTH_TOKEN -e CODEBUDDY_IS_SANDBOX=1 \
            agent-harness:local -lc '
              timeout 300 codebuddy -p "Reply with the single word: alive" -y --permission-mode bypassPermissions --max-turns 2 --model deepseek-v4.1-flash > /tmp/cb-probe.log 2>&1
              echo "RC=$?" >> /tmp/cb-probe.log
              tail -3 /tmp/cb-probe.log
            ' > /tmp/cb-out.log 2>&1
          CBLOG=$(cat /tmp/cb-out.log 2>/dev/null || echo "(no output captured)")
          # 3) grade with the lane's own failure-marker set
          if printf '%s' "$CBLOG" | grep -qE 'ETIMEDOUT|ECONNREFUSED|ENOTFOUND|EAI_AGAIN|网络请求超时|502 Bad Gateway'; then
            VERDICT="LANE DEAD (network marker present)"
          elif printf '%s' "$CBLOG" | grep -q 'RC=0'; then
            VERDICT="LANE ALIVE"
          else
            VERDICT="LANE UNKNOWN (no marker, nonzero rc)"
          fi
          SNIPPET=$(printf '%s' "$CBLOG" | head -c 120 | tr '\n' ' ' | tr -d '|' | tr -d '\`')
          echo "| codebuddy lane (deepseek-v4.1-flash) | https://www.codebuddy.ai via CLI | $NET | $VERDICT — $SNIPPET |" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          cat "$SUMMARY" || true

      - name: Probe opencode built-in lanes (wave-3 QA-4/5 + Plat-3/4 — Owner order 2026-10-24 17:01Z)
        continue-on-error: true
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY"
          echo "" >> "$SUMMARY"
          echo "### OpenCode built-in lanes probe (wave-3 hires: CANONICAL registry ids on the in-image body)" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          # 10-dj ROOT CAUSE (Owner 2026-10-25 19:19Z 'they must work'): the prior
          # probe called BARE ids (glm-5.1-flash, nemotron-3.5-lightning, ...) that
          # do not exist under those names -> RC=1 in ~2s, four DEAD rows with no
          # error text. models.dev snapshot (fetched 2026-10-25 19:2xZ) shows the
          # real free roster: nemotron-3.5-lightning-free, mimo-v2.6-flash-free,
          # longcat-2.5-preview-free exist; 'glm-5.1-flash' does NOT (closest free
          # GLM: glm-5.3-flash-free / glm-5-free — probed alongside for QA-4
          # substitution evidence). Form is provider/model. Also: capture the FULL
          # probe log (cat), not tail -3, so a dead row shows its real error class.
          # harness image: reuse the one the codebuddy probe built when present,
          # else build (gha cache makes a warm rebuild cheap)
          docker image inspect agent-harness:local > /dev/null 2>&1 || \
            docker buildx build --load --cache-from type=gha --cache-to type=gha,mode=max \
              -f docker/harness/Dockerfile -t agent-harness:local . > /tmp/harness-build2.log 2>&1 \
            || { echo "| opencode built-ins | SKIP | - | harness image build failed (see build log) |" >> "$SUMMARY"; tail -5 /tmp/harness-build2.log 2>/dev/null; cat "$SUMMARY" || true; exit 0; }
          # canonical ids = opencode/<model> from models.dev 'opencode' provider;
          # zero-key IF the client serves anonymous free usage — the probe MEASURES that
          # (a dead row with the exact error is honest evidence, not a fault)
          for M in opencode/glm-5.3-flash-free opencode/glm-5-free opencode/nemotron-3.5-lightning-free opencode/mimo-v2.6-flash-free opencode/longcat-2.5-preview-free; do
            OUT=$(docker run --rm --entrypoint bash agent-harness:local -lc "timeout 240 opencode run --print-logs --model '$M' 'Reply with the single word: alive' > /tmp/oc-probe.log 2>&1; echo RC=\$? >> /tmp/oc-probe.log; cat /tmp/oc-probe.log" 2>&1 || echo '(no output captured)')
            if printf '%s' "$OUT" | grep -q 'RC=0'; then VERDICT="LANE ALIVE"; else VERDICT="LANE DEAD/UNKNOWN"; fi
            # 10-dj: grep the failure CLASS from the FULL log (OUT now carries the
            # whole /tmp/oc-probe.log); drop the bare RC= match from SNIP so the
            # row shows the real error, and fall back to the log tail if no class
            SNIP=$(printf '%s' "$OUT" | grep -aoE 'level=(ERROR|WARN)[^,]{0,90}|[Ee]rror[^|\`]{0,90}|[Uu]nauthorized[^|\`]{0,60}|[Ff]orbidden[^|\`]{0,60}|not found[^|\`]{0,60}|[0-9]{3} (Unauthorized|Forbidden|Not Found)[^|\`]{0,40}|No credentials[^|\`]{0,60}|[Aa]uth[^|\`]{0,70}' | tail -3 | tr '\n' ' ' | tr -d '|\`' | head -c 300)
            [ -n "$SNIP" ] || SNIP=$(printf '%s' "$OUT" | grep -a 'RC=' | tail -1)
            echo "| opencode built-in ($M) | opencode console free roster | - | $VERDICT — $SNIP |" >> "$SUMMARY"
          done
          echo "" >> "$SUMMARY"
          cat "$SUMMARY" || true

      - name: Probe cline lane (wave-3 QA-6/QA-7 — API leg via CLINE_API_KEY; free-account creds sealing is a separate DoE deliverable)
        continue-on-error: true
        env:
          CLINE_API_KEY: ${{ secrets.CLINE_API_KEY }}
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY"
          echo "" >> "$SUMMARY"
          echo "### Cline lane probe (CLI + key + model)" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          if [ -z "$CLINE_API_KEY" ]; then
            echo "| cline lane | SKIP | - | CLINE_API_KEY not in repo secrets (Owner action pending; DoE cardless-account creds alternative not yet sealed) |" >> "$SUMMARY"
            cat "$SUMMARY" || true
            exit 0
          fi
          docker image inspect agent-harness:local > /dev/null 2>&1 || \
            docker buildx build --load --cache-from type=gha --cache-to type=gha,mode=max \
              -f docker/harness/Dockerfile -t agent-harness:local . > /tmp/harness-build3.log 2>&1 \
            || { echo "| cline lane | SKIP | - | harness image build failed (see build log) |" >> "$SUMMARY"; tail -5 /tmp/harness-build3.log 2>/dev/null; cat "$SUMMARY" || true; exit 0; }
          OUT=$(docker run --rm --entrypoint bash -e CLINE_API_KEY agent-harness:local -lc 'cline auth -p cline -k "$CLINE_API_KEY" -m nvidia/nemotron-3.5-lightning-free > /tmp/cl-probe.log 2>&1; echo AUTH_RC=$? >> /tmp/cl-probe.log; timeout 240 cline "Reply with the single word: alive" --json >> /tmp/cl-probe.log 2>&1; echo TASK_RC=$? >> /tmp/cl-probe.log; tail -4 /tmp/cl-probe.log' 2>&1 || echo '(no output captured)')
          if printf '%s' "$OUT" | grep -q 'TASK_RC=0'; then VERDICT="LANE ALIVE"; else VERDICT="LANE DEAD/UNKNOWN"; fi
          SNIP=$(printf '%s' "$OUT" | head -c 120 | tr '\n' ' ' | tr -d '|' | tr -d '\`')
          echo "| cline lane (nvidia/nemotron-3.5-lightning-free) | api.cline.bot via CLI | - | $VERDICT — $SNIP |" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          cat "$SUMMARY" || true

      - name: Probe mcode lane (real CLI in the harness image — board item mcode-lane-activation, Owner credential sealed 2026-10-25T20:39Z)
        continue-on-error: true
        env:
          MCODE_AUTH_JSON: ${{ secrets.MCODE_AUTH_JSON }}
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY"
          echo "" >> "$SUMMARY"
          echo "### mcode lane probe (the lane itself: CLI + Owner token + baked private node 24)" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          if [ -z "$MCODE_AUTH_JSON" ]; then
            echo "| mcode lane | SKIP | - | MCODE_AUTH_JSON not set in repo secrets |" >> "$SUMMARY"
            cat "$SUMMARY" || true
            exit 0
          fi
          # reuse the image the codebuddy probe built when present (gha cache)
          docker image inspect agent-harness:local > /dev/null 2>&1 || \
            docker buildx build --load --cache-from type=gha --cache-to type=gha,mode=max \
              -f docker/harness/Dockerfile -t agent-harness:local . > /tmp/harness-build-mcode.log 2>&1 \
              || { echo "| mcode lane | SKIP | - | harness image build failed (see build log) |" >> "$SUMMARY"; tail -5 /tmp/harness-build-mcode.log; cat "$SUMMARY" || true; exit 0; }
          # the EXACT lane contract from the bake (Dockerfile + the 0652
          # delivery): exec --permission full, JSON to -o, work in --cwd;
          # the Owner token restored to ~/.minimax/auth.json under a pinned
          # writable HOME. The refusal marker is the bake's measured
          # skip-guard — it grades the credential, not the network.
          docker run --rm --entrypoint bash -e MCODE_AUTH_JSON \
            agent-harness:local -lc '
              mkdir -p /tmp/mcode-home/.minimax && printf "%s" "$MCODE_AUTH_JSON" > /tmp/mcode-home/.minimax/auth.json
              timeout 300 env HOME=/tmp/mcode-home mcode exec --permission full --output-format json -o /tmp/mcode-out.json --cwd /tmp "Reply with the single word: alive" > /tmp/mc-probe.log 2>&1
              echo "RC=$?" >> /tmp/mc-probe.log
              tail -3 /tmp/mc-probe.log
            ' > /tmp/mc-out.log 2>&1
          MCLOG=$(cat /tmp/mc-out.log 2>/dev/null || echo "(no output captured)")
          if printf '%s' "$MCLOG" | grep -qE 'Sign in to MiniMax|ETIMEDOUT|ECONNREFUSED|ENOTFOUND|EAI_AGAIN'; then
            VERDICT="LANE DEAD (refusal or network marker present)"
          elif printf '%s' "$MCLOG" | grep -q 'RC=0'; then
            VERDICT="LANE ALIVE"
          else
            VERDICT="LANE UNKNOWN (no marker, nonzero rc)"
          fi
          SNIPPET=$(printf '%s' "$MCLOG" | head -c 120 | tr '\n' ' ' | tr -d '|' | tr -d '\`')
          echo "| mcode lane (minimax-agent) | MiniMax coding agent via CLI, auth.json restore | account auth (no host ping) | $VERDICT — $SNIPPET |" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          cat "$SUMMARY" || true

  # ONE TURN OF WORK. Reads agent-team/TEAM-CONTROL.org:
  #   #+KILL-SWITCH: ON           -> stop everything, exit green.
  #   #+OBJECTIVE-STATE: COMPLETE -> objective closed, exit green.
  #   #+OBJECTIVE: empty          -> no work defined; gate stays green, skip.
  #   otherwise                   -> run the on-turn member's REAL agent
  #                                  (preinstalled in the harness container)
  #                                  for one segment toward the objective,
  #                                  advance the rotation, commit.
  turn:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [test, probe]
    outputs:
      turn_branch: ${{ steps.push.outputs.branch }}
      seg_result: ${{ steps.seg.outputs.result }}
      tg_chat: ${{ steps.ingest.outputs.chat_id }}   # owner-locked chat id (secret TELEGRAM_OWNER_ID)
      base_sha: ${{ steps.control.outputs.base_sha }} # ai/main before this segment — the Discord chat-mirror diff base
      seat: ${{ steps.control.outputs.seat }}        # which seat ran — surfaced in the Telegram verdict
      mode: ${{ steps.control.outputs.mode }}        # 0615 identity-stamp pass-through: WHY a turn delivered no reviewer identity (Lead 10-fg)
      pending_branch: ${{ steps.seg.outputs.pending_branch }}   # SEGREGATION LAW: branch awaiting THIS run's review
      pending_author: ${{ steps.seg.outputs.pending_author }}   # who authored it (merger refuses same-member reviews)
      pending_sha: ${{ steps.seg.outputs.pending_sha }}
      review_verdict: ${{ steps.seg.outputs.review_verdict }}   # APPROVED | REJECTED | empty (review-missing)
      review_seat: ${{ steps.seg.outputs.review_seat }}         # duty reviewer that ran (quality-assurance-engineer | visiting-engineer)
      review_member: ${{ steps.seg.outputs.review_member }}     # duty reviewer's member ID (merger enforces the duty-role law)
      seg_outcome: ${{ steps.seg.outcome }}             # 0615 identity-stamp pass-through: success|skipped|failure|cancelled (Lead 10-fg)
      review_lane_dead: ${{ steps.seg.outputs.review_lane_dead }} # 1 = substitution marker in the review output with no VERDICT token (honest lane-dead; Lead cycle 10-l, job 120814481260 evidence)
      review_substituted: ${{ steps.seg.outputs.review_substituted }} # 1 = the reviewer BRAIN was provider-substituted, verdict or no verdict — provenance only, changes no outcome (Lead cycles 10-az..10-bj: five verdicts judged by a substitute while lane_dead=0)
      review_sub_brain: ${{ steps.seg.outputs.review_sub_brain }}   # the substitute's own name, from its marker line (empty when the duty brain answered)
    runs-on: ubuntu-latest
    timeout-minutes: 50   # raised 35->50 (Lead, cycle 9-f): must exceed the seg step's 45 so the step's own timeout is what fails first, with artifacts still collected
    continue-on-error: true
    env:
      QODER_PERSONAL_ACCESS_TOKEN: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}   # fallback brain — self-heals when the Owner sets it
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}   # minimax relief lane
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}   # qwen3.8-27b relief lane (Lead fix 2026-10-22: qoder quota-dead, zai rate-limited)
      CODEBUDDY_AUTH_TOKEN: ${{ secrets.CODEBUDDY_AUTH_TOKEN }}   # deepseek-v4.1-flash free-offer hire (Owner 2026-10-22)
      MCODE_AUTH_JSON: ${{ secrets.MCODE_AUTH_JSON }}   # MiniMax coding-agent CLI (Owner-sealed 2026-10-25T20:39Z; board item mcode-lane-activation — Lead arm 10-eh)
      GH_TOKEN: ${{ secrets.GH_PAT }}   # Copilot CLI auth (fine-grained PAT, Copilot Requests —
      # live-verified 2026-10-27); ask-first body, env-injected, never baked
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}   # Cursor CLI body (Owner key, exchanged +
      # live-verified 2026-10-28); ask-first body, env-injected, never baked
      GOMODEL_MASTER_KEY: ${{ secrets.GOMODEL_MASTER_KEY }}   # Jev judgment layer (health-gated; URL comes from the resolve step)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read control file (kill switch / objective / turn)
        id: control
        run: |
          CTL=agent-team/TEAM-CONTROL.org
          KILL=$(grep -oP '^\#\+KILL-SWITCH:\s*\K\w+' "$CTL" | head -1 || true)
          OBJSTATE=$(grep -oP '^\#\+OBJECTIVE-STATE:\s*\K\w+' "$CTL" | head -1 || true)
          OBJECTIVE=$(grep -oP '^\#\+OBJECTIVE:\s*\K.*' "$CTL" | head -1 || true)
          TURN=$(grep -oP '^\#\+TURN:\s*\K.*' "$CTL" | head -1 | xargs)
          echo "kill=${KILL:-OFF} objstate=${OBJSTATE:-OPEN} turn='${TURN}'"
          # Pre-segment ai/main tip: the Discord chat mirror diffs TEAM-CHAT.org
          # from here to post-merge HEAD to extract THIS segment's GLM chats.
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "${KILL:-OFF}" = "ON" ]; then
            echo "mode=killed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${OBJSTATE:-OPEN}" = "COMPLETE" ]; then
            echo "mode=complete" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # PAUSE LAW (Owner order 2026-10-22 #admincraft: "After completing
          # a TODO, pause and summarize which role did what"): finalize arms
          # #+CHAIN-PAUSE when a segment delivers a TODO. Turns stay halted
          # until the Lead clears the line after reviewing the roles' work.
          CHAINPAUSE=$(grep -oP '^\#\+CHAIN-PAUSE:\s*\K.*' "$CTL" | head -1 | xargs || true)
          # Any non-empty value pauses — EXCEPT the literal "OFF" (Owner
          # ec22dcc wrote "#+CHAIN-PAUSE: OFF" and froze the chain: the
          # bare -n test read it as armed). Empty or OFF = chain runs.
          if [ -n "$CHAINPAUSE" ] && ! printf '%s' "$CHAINPAUSE" | grep -qi '^off$'; then
            echo "mode=paused" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Placeholder objective = nothing specified by the Owner yet.
          if [ -z "$OBJECTIVE" ] || echo "$OBJECTIVE" | grep -q "the Owner writes"; then
            echo "mode=no-objective" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "mode=work" >> "$GITHUB_OUTPUT"
          echo "objective=$OBJECTIVE" >> "$GITHUB_OUTPUT"
          # Seat pointer -> seat id. The case grammar is extensible: one
          # line per rotation entry ("model@body ... role" pointer forms).
          # MEMBER ID FORMAT LAW v2 (Owner 2026-10-22 16:54Z #admincraft:
          # "PROVIDER/ should only be included with API models!"):
          # key-served API lanes on goose keep the PROVIDER/ prefix
          # (zai/ groq/ openrouter/ gomodel/ ...); platform-native
          # bundled brains are BARE model@platform (qoder, codebuddy).
          # Legacy arms (format-law v1 prefixed + rotation-v1) kept so
          # pointers written by runs still on the old code land on the
          # right seat instead of BLOCKED.
          case "$TURN" in
            qwen3.8-flash@qoder*)                      NEXT_SEAT=platform-engineer ;;            # v2 PRIMARY: bare platform-native
            deepseek-v4.1-flash@codebuddy*)            NEXT_SEAT=software-engineer ;;            # v2 PRIMARY
            deepseek-v4.1-flash@qoder*)                NEXT_SEAT=quality-assurance-engineer ;;   # v2 PRIMARY
            glm-5.3@codebuddy*)                        NEXT_SEAT=visiting-engineer ;;            # v2 PRIMARY — PAID visiting burn (Owner ~16:08Z)
            zai/glm-4.7-flash@goose*)                  NEXT_SEAT=relief-engineer ;;              # API lane: prefix stays
            openrouter/minimax-m3.1-flash:free@goose*) NEXT_SEAT=relief-engineer ;;              # API lane: prefix stays (historical pointers)
            openrouter/poolside/laguna-s-2.1:free@goose*) NEXT_SEAT=relief-engineer ;;           # relief swap 2026-10-23 (DE TEAM-UPDATE #2)
            groq/qwen3.8-27b@goose*)                   NEXT_SEAT=relief-engineer ;;              # API lane: prefix stays
            glm-4.7-flash@goose*)                      NEXT_SEAT=relief-engineer ;;              # legacy rotation-v1
            qoder/qwen3.8-flash@qoder*)                NEXT_SEAT=platform-engineer ;;            # v1 alias
            codebuddy/deepseek-v4.1-flash@codebuddy*)  NEXT_SEAT=software-engineer ;;            # v1 alias
            qoder/deepseek-v4.1-flash@qoder*)          NEXT_SEAT=quality-assurance-engineer ;;   # v1 alias
            codebuddy/glm-5.3@codebuddy*)              NEXT_SEAT=visiting-engineer ;;            # v1 alias
            *)                                         NEXT_SEAT=unknown ;;
          esac
          echo "seat=$NEXT_SEAT" >> "$GITHUB_OUTPUT"

      - name: Stop notice (kill switch / complete / no objective)
        if: steps.control.outputs.mode != 'work'
        run: |
          MODE="${{ steps.control.outputs.mode }}"
          SUMMARY="$GITHUB_STEP_SUMMARY"
          case "$MODE" in
            killed)       MSG="TEAM STOPPED BY KILL SWITCH — no turns run until #+KILL-SWITCH: OFF" ;;
            complete)     MSG="OBJECTIVE COMPLETE — team standing down (set #+OBJECTIVE-STATE: OPEN with a new objective to restart)" ;;
            paused)       MSG="CHAIN PAUSED — a TODO was delivered and the pause law is ON; the Lead reviews, then clears #+CHAIN-PAUSE in agent-team/TEAM-CONTROL.org to resume" ;;
            no-objective) MSG="NO OBJECTIVE SET — write one line into #+OBJECTIVE in agent-team/TEAM-CONTROL.org; rotation idle until then" ;;
          esac
          echo "$MSG" >> "$SUMMARY"

      - name: Resolve gateway (override -> deployment -> local -> boot — Owner order 2026-10-22)
        if: steps.control.outputs.mode == 'work'
        env:
          GOMODEL_MASTER_KEY: ${{ secrets.GOMODEL_MASTER_KEY }}
          GOMODEL_GATEWAY_OVERRIDE: ${{ vars.GOMODEL_GATEWAY_URL }}
        run: |
          set -u
          # Owner resolution law (2026-10-22): 1) vars.GOMODEL_GATEWAY_URL
          # override wins when set; 2) https://ai.khalidrafi.tech — the
          # deployment; 3) http://localhost:8080 — an already-running
          # listener; 4) ONLY when nothing answers does the next step boot
          # gomodel inside the runner (nothing answers == no deployment is
          # active right now). Every tier uses the ping contract
          # (agent-team-gateway-ping): GET / -> 404/200 = UP, else down.
          # The judgment lane is BINARY and rides no provider chain: Jev
          # via the resolved gateway when it is up, else the chain decides
          # directly (local rules) — never red.
          SUMMARY="$GITHUB_STEP_SUMMARY"
          ping() {
            curl -s -o /dev/null -m 20 -w '%{http_code}' \
              -H "Authorization: Bearer ${GOMODEL_MASTER_KEY:-}" "$1/" || echo 000
          }
          if [ -n "${GOMODEL_GATEWAY_OVERRIDE:-}" ]; then
            echo "GOMODEL_GATEWAY_URL=${GOMODEL_GATEWAY_OVERRIDE}" >> "$GITHUB_ENV"
            echo "GOMODEL_BOOT=skip" >> "$GITHUB_ENV"
            echo "gateway: vars.GOMODEL_GATEWAY_URL override in force (${GOMODEL_GATEWAY_OVERRIDE}) — health step still gates it" >> "$SUMMARY"
            exit 0
          fi
          CODE=$(ping "https://ai.khalidrafi.tech")
          if [ "$CODE" = "404" ] || [ "$CODE" = "200" ]; then
            echo "GOMODEL_GATEWAY_URL=https://ai.khalidrafi.tech" >> "$GITHUB_ENV"
            echo "GOMODEL_BOOT=skip" >> "$GITHUB_ENV"
            echo "gateway: deployment UP at ai.khalidrafi.tech (HTTP $CODE) — in-runner boot skipped" >> "$SUMMARY"
            exit 0
          fi
          REMOTE_CODE="$CODE"
          CODE=$(ping "http://localhost:8080")
          if [ "$CODE" = "404" ] || [ "$CODE" = "200" ]; then
            echo "GOMODEL_GATEWAY_URL=http://localhost:8080" >> "$GITHUB_ENV"
            echo "GOMODEL_BOOT=skip" >> "$GITHUB_ENV"
            echo "gateway: local listener UP at localhost:8080 (HTTP $CODE) — in-runner boot skipped" >> "$SUMMARY"
            exit 0
          fi
          echo "GOMODEL_GATEWAY_URL=http://localhost:8080" >> "$GITHUB_ENV"
          echo "GOMODEL_BOOT=boot" >> "$GITHUB_ENV"
          echo "gateway: nothing answers (ai.khalidrafi.tech HTTP ${REMOTE_CODE}, localhost:8080 HTTP ${CODE}) — next step boots gomodel in-runner (last resort)" >> "$SUMMARY"
          exit 0

      - name: GoModel gateway up (inside the runner — Owner order 2026-10-22)
        if: steps.control.outputs.mode == 'work' && env.GOMODEL_BOOT != 'skip'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GOMODEL_MASTER_KEY: ${{ secrets.GOMODEL_MASTER_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          # Provider keys into the container (Owner 2026-10-23 19:58Z
          # "configure it properly in gomodel"): the config references
          # ${ZAI_API_KEY}/${GROQ_API_KEY}/${OPENROUTER_API_KEY} — without
          # these the gateway boots keyless and serves no usable provider.
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -u
          if [ -z "${GH_PAT:-}" ]; then
            echo "::warning::GH_PAT missing — cannot clone khaalidrafi/llmfisher for the gateway config; gomodel lane stays DOWN -> fallback (never red)"
            exit 0
          fi
          rm -rf /tmp/llmfisher-src
          git clone --quiet --depth 1 \
            "https://x-access-token:${GH_PAT}@github.com/khaalidrafi/llmfisher" \
            /tmp/llmfisher-src
          docker rm -f gomodel >/dev/null 2>&1 || true
          # Tuned env block = llmfisher docker-compose.yml gomodel service
          # verbatim (field types checked per the GoModel source; a wrong
          # shape is a crash loop, not a warning). Keys ride as env only
          # (env-var law): nothing baked, nothing printed, nothing in git.
          export JEV_API_KEY="${TYPESAFE_API_KEY:-}"
          docker run -d --name gomodel -p 127.0.0.1:8080:8080 \
            -v /tmp/llmfisher-src/config:/app/config:ro \
            -v gomodel_data:/app/data \
            -e SQLITE_PATH=/app/data/gomodel.db \
            -e CONFIGURED_PROVIDER_MODELS_MODE=allowlist \
            -e FAILOVER_RETRY_ON_STATUSES=4xx,5xx \
            -e FAILOVER_MAX_ATTEMPTS=5 \
            -e RETRY_MAX_RETRIES=3 \
            -e RETRY_INITIAL_BACKOFF=5s \
            -e CIRCUIT_BREAKER_SCOPE=model \
            -e HTTP_RESPONSE_HEADER_TIMEOUT=30 \
            -e CACHE_REFRESH_INTERVAL=21600 \
            -e PROVIDER_RECHECK_INTERVAL=300 \
            -e LOG_LEVEL=info \
            -e PROVIDER_PROMPT_CACHE_PLANNER_ENABLED=false \
            -e GOMODEL_DEMO_MODE=false \
            -e GOMODEL_MASTER_KEY -e JEV_API_KEY \
            -e ZAI_API_KEY -e GROQ_API_KEY -e OPENROUTER_API_KEY \
            enterpilot/gomodel >/dev/null
          ok=""
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -m 2 -w '%{http_code}' \
              -H "Authorization: Bearer ${GOMODEL_MASTER_KEY:-}" \
              "http://localhost:8080/" || echo 000)
            if [ "$CODE" = "404" ] || [ "$CODE" = "200" ]; then
              echo "GoModel gateway UP inside the runner (HTTP $CODE, ping contract)"
              ok=1; break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::warning::gomodel container did not answer in 30s — lane stays DOWN -> fallback (never red)"
            docker logs --tail 20 gomodel 2>&1 \
              | sed 's/[A-Za-z0-9+/=_-]\{20,\}/[redacted]/g' || true
          fi
          exit 0

      - name: GoModel lane health (llmfisher gateway — Jev judgment layer)
        if: steps.control.outputs.mode == 'work'
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY"
          # Owner gateway contract (agent-team.el agent-team-gateway-ping):
          # GET / answers HTTP 404 when the ORIGIN is up; 530/000 = tunnel down.
          CODE=$(curl -s -o /dev/null -m 20 -w '%{http_code}' \
                  -H "Authorization: Bearer ${GOMODEL_MASTER_KEY}" \
                  "${GOMODEL_GATEWAY_URL}/" || echo 000)
          if [ "$CODE" = "404" ] || [ "$CODE" = "200" ]; then
            echo "GOMODEL_UP=true" >> "$GITHUB_ENV"
            echo "gomodel lane: UP (gateway HTTP $CODE) — Jev available to this turn and finalize" >> "$SUMMARY"
          else
            echo "GOMODEL_UP=false" >> "$GITHUB_ENV"
            echo "gomodel lane: DOWN (HTTP $CODE) — lane-fallback law active (turn proceeds on direct provider lanes; auto-reuses gomodel the moment the box answers)" >> "$SUMMARY"
          fi

      - name: Build harness image (preinstalled agents — cached, no installs)
        if: steps.control.outputs.mode == 'work'
        run: |
          docker buildx build --load \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -f docker/harness/Dockerfile \
            -t agent-harness:local \
            .

      - name: Prepare git identity
        if: steps.control.outputs.mode == 'work'
        run: |
          git config user.name "agent-team-ci"
          git config user.email "agent-team-ci@users.noreply.github.com"
          git remote set-url --push origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

      # Owner channel — INBOUND leg (Owner order 2026-10-21 #hq: "You and
      # any team member should contact me through this [Telegram bot]. And,
      # my reply should get recorded in TEAM-CHAT.org"; 17:47Z addendum:
      # "Keep bridge bot restricted to my chat ID — else anyone can
      # impersonate me"). Only messages from the Owner's chat (secret
      # TELEGRAM_OWNER_ID, else TELEGRAM_CHAT_ID) are recorded VERBATIM
      # into the team chat as an @owner entry BEFORE the segment runs;
      # every OTHER chat is DROPPED and counted in the run log —
      # impersonation impossible. Until the secret is set, even a first
      # contact is dropped and surfaced only in the run summary as a claim
      # for the Lead to verify and activate. Runs even when the chain is
      # idle/killed — the chat is the record.
      - name: Telegram bridge — ingest Owner replies into the team chat (owner-locked)
        id: ingest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] || { echo "telegram: no token — silent"; exit 0; }
          OWNER="${TELEGRAM_OWNER_ID:-${TELEGRAM_CHAT_ID}}"
          git config user.name "agent-team-ci"
          git config user.email "agent-team-ci@users.noreply.github.com"
          git remote set-url --push origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          CHAT=agent-team/TEAM-CHAT.org
          UPD=$(curl -sS --max-time 20 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?allowed_updates=%5B%22message%22%5D&limit=20") || UPD=""
          echo "$UPD" | jq -e '.ok == true' >/dev/null 2>&1 || { echo "telegram: API error or empty — skip"; exit 0; }
          if [ -z "$OWNER" ]; then
            CLAIM=$(echo "$UPD" | jq -r '[.result[] | select(.message.chat.type=="private") | .message.chat.id] | first // empty')
            if [ -n "$CLAIM" ]; then
              echo "::warning::telegram lock ENGAGED, TELEGRAM_OWNER_ID unset — first-contact claim from chat ${CLAIM} DROPPED (nothing reached the team chat; the Lead verifies and sets the secret)"
              {
                echo "### Telegram bridge — LOCKED, claim pending"
                echo "First-contact claim from chat \`${CLAIM}\` was DROPPED (owner lock engaged, secret unset)."
                echo "The Lead verifies the claim is really the Owner, then sets the TELEGRAM_OWNER_ID secret. Until then NOTHING is ingested — impersonation impossible."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "telegram: lock engaged (no owner secret yet), no pending messages"
            fi
            exit 0
          fi
          COUNT=$(echo "$UPD" | jq --arg owner "$OWNER" '[.result[] | select(.message.chat.type=="private") and (.message.text != null) and ((.message.chat.id | tostring) == $owner)] | length')
          REJECT=$(echo "$UPD" | jq --arg owner "$OWNER" '[.result[] | select(.message.chat.type=="private") and ((.message.chat.id | tostring) != $owner)] | length')
          if [ "$REJECT" -gt 0 ]; then
            echo "::warning::telegram: DROPPED ${REJECT} message(s) from non-owner chat(s) — logged here, never ingested (owner lock)"
          fi
          if [ "$COUNT" -eq 0 ]; then echo "telegram: no pending OWNER messages (dropped ${REJECT} non-owner)"; exit 0; fi
          LAST_ID=$(echo "$UPD" | jq '[.result[].update_id] | max')
          CHAT_ID="$OWNER"
          TS=$(date -u '+%Y-%m-%d %a %H:%M UTC')
          {
            echo ""
            echo "* MSG owner (tg) -> @lead :note:                    :msg:owner:lead:note:"
            echo ":PROPERTIES:"
            echo ":FROM: owner"
            echo ":TO: lead"
            echo ":KIND: note"
            echo ":WHEN: [${TS}]"
            echo ":CHANNEL: telegram"
            echo ":END:"
            echo "  [Telegram bridge — Owner's message, recorded verbatim per Owner"
            echo "   order 2026-10-21 #hq: \"my reply should get recorded in TEAM-CHAT.org\"]"
            echo "$UPD" | jq -r '.result[] | select(.message.chat.type=="private") | select(.message.text) |
                     "  >> " + (.message.text | gsub("\n"; "\n  >> "))'
          } >> "$CHAT"
          # SECRET GUARD (Owner order 18:27Z): his message is recorded
          # VERBATIM — but a credential pasted by mistake must never reach
          # git history. Redact in place, then commit.
          bash .github/scripts/secret-guard.sh file "$CHAT"
          git add "$CHAT"
          git commit -m "tg-ingest: ${COUNT} Owner message(s) -> team chat" || echo "::notice::nothing to commit"
          # Race-proof push (Lead pushes move ai/main mid-run): rebase + retry.
          PUSHED=no
          for i in 1 2 3; do
            if git push origin "ai/main"; then PUSHED=yes; break; fi
            git fetch origin ai/main && git rebase origin/ai/main || git rebase --abort
          done
          if [ "$PUSHED" = "yes" ] && [ -n "$LAST_ID" ]; then
            curl -sS -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?offset=$((LAST_ID+1))"
            echo "telegram: ingested ${COUNT} message(s), chat_id=${CHAT_ID:-unlearned}, offset confirmed"
          else
            git checkout -- "$CHAT" || true
            echo "::warning::telegram ingest push failed — messages left unconfirmed for the next run"
          fi
          if [ -n "$CHAT_ID" ]; then
            echo "chat_id=${CHAT_ID}" >> "$GITHUB_OUTPUT"
            echo "TG_LEARNED_CHAT=${CHAT_ID}" >> "$GITHUB_ENV"
          fi

      - name: Restore previous session of this seat (resume context)
        id: sess-restore
        if: steps.control.outputs.mode == 'work'
        env:
          SEAT: ${{ steps.control.outputs.seat }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ART_ID=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            | jq -r --arg p "sessions-${SEAT}-" \
              '[.artifacts[] | select(.name | startswith($p))] | sort_by(.id) | last | .id // empty')
          [ -n "$ART_ID" ] || { echo "sessions: no previous artifact for ${SEAT} — cold start"; exit 0; }
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" -o "$PWD/.sessions-prev.zip" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ART_ID}/zip"
          mkdir -p "$PWD/.sessions-restore"
          unzip -q -o "$PWD/.sessions-prev.zip" -d "$PWD/.sessions-restore" || true
          TGZ=$(ls "$PWD"/.sessions-restore/sessions-*.tgz 2>/dev/null | head -1)
          if [ -n "${TGZ:-}" ]; then
            rm -rf /tmp/sessx && mkdir -p /tmp/sessx
            tar xzf "$TGZ" -C /tmp/sessx 2>/dev/null || true
            rm -rf "$PWD/.sessions-restore" && mv /tmp/sessx "$PWD/.sessions-restore"
          fi
          rm -f "$PWD/.sessions-prev.zip"
          echo "sessions: restored artifact ${ART_ID} for seat ${SEAT}"

      - name: Run the turn (one segment, preinstalled agent in container)
        id: seg
        if: steps.control.outputs.mode == 'work'
        timeout-minutes: 45   # raised 30->45 (Lead, night-2 cycle 9-f, run 40024810045 evidence): review (~15-20 min) + author segment (~25-30 min) cannot both fit 30 — the step timed out at 30 min with nothing delivered. The turn_segment.sh already-merged skip frees the budget when the review is moot; 45 covers the real-review + real-author worst case. A hung harness still fails THIS step, not the rotation.
        env:
          SEG_SEAT: ${{ steps.control.outputs.seat }}
          CLOCK_TOKEN: ${{ github.token }}
        run: bash .github/scripts/turn_segment.sh
      # SESSION FILES (Owner order 2026-10-21 18:27Z "how will you handle
      # agents' session files? ... We need the session files to resume with
      # context for a team member. They are important."): the container is
      # --rm, so sessions die with it unless collected. The seat's tarball
      # is scrubbed file-by-file by the SECRET GUARD (a session that
      # swallowed a token must not leak it into the artifact), re-packed
      # and uploaded. Resume: the next turn of THIS seat downloads the
      # newest artifact and mounts it back into the container's $HOME.
      - name: Persist session files (scrub -> artifact)
        id: sess
        if: always() && steps.control.outputs.mode == 'work'
        env:
          SEAT: ${{ steps.control.outputs.seat }}
        run: |
          echo "found=no" >> "$GITHUB_OUTPUT"
          [ -s "$PWD/.turn-sessions.tgz" ] || { echo "sessions: nothing collected"; exit 0; }
          rm -rf /tmp/sess && mkdir -p /tmp/sess
          tar xzf "$PWD/.turn-sessions.tgz" -C /tmp/sess 2>/dev/null || true
          N=0
          while IFS= read -r f; do
            if out=$(bash .github/scripts/secret-guard.sh file "$f"); then N=$((N+1)); fi
          done < <(find /tmp/sess -type f 2>/dev/null)
          tar czf "/tmp/sessions-${SEAT}-${GITHUB_RUN_NUMBER}.tgz" -C /tmp/sess . 2>/dev/null || true
          if [ -s "/tmp/sessions-${SEAT}-${GITHUB_RUN_NUMBER}.tgz" ]; then
            # v4 upload-artifact rejects absolute paths outside the
            # workspace — copy in before upload (run 39485635406 failure)
            mkdir -p "$PWD/.sessions-upload"
            cp "/tmp/sessions-${SEAT}-${GITHUB_RUN_NUMBER}.tgz" "$PWD/.sessions-upload/"
            echo "found=yes" >> "$GITHUB_OUTPUT"
            echo "sessions: ${N} file(s) had secret hits — redacted before upload" >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f "$PWD/.turn-sessions.tgz"

      - name: Upload session artifact (30-day retention)
        if: always() && steps.sess.outputs.found == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: sessions-${{ steps.control.outputs.seat }}-${{ github.run_number }}
          path: .sessions-upload/sessions-*.tgz
          retention-days: 30
          if-no-files-found: ignore

      # 10-bb (Lead): the review lane's full transcript was parsed for the
      # verdict token and then discarded — every rejection REASON was
      # unobtainable from CI (evidence: 1632 rejected 4x, reasons invisible,
      # triage went blind twice; only the parse line survives in job logs).
      # The host parse at turn_segment.sh reads $PWD/.turn-review.txt, so the
      # file is on the runner — persist it (secret-guarded) as an artifact.
      - name: Stage review transcript for artifact (secret-guarded)
        if: always()
        run: |
          if [ -s "$PWD/.turn-review.txt" ]; then
            bash .github/scripts/secret-guard.sh file "$PWD/.turn-review.txt" || true
            mkdir -p "$PWD/.review-upload"
            cp "$PWD/.turn-review.txt" "$PWD/.review-upload/review-transcript.txt"
            echo "review transcript captured ($(wc -c < "$PWD/.review-upload/review-transcript.txt") bytes)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "review transcript absent (no review duty or lane produced no output)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload review transcript artifact (30-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-transcript-${{ github.run_number }}
          path: .review-upload/review-transcript.txt
          retention-days: 30
          if-no-files-found: ignore

      # Peer-mesh law: the seat's branch is auto-merged by `finalize` right
      # after this step; ONLY the control-file pointer lands on ai/main here.
      - name: Push work branch, advance rotation, commit control file
        id: push
        if: always() && steps.control.outputs.mode == 'work'   # never stall the rotation on a step failure
        run: |
          # SECRET GUARD (Owner order 18:27Z): scan the whole branch diff
          # for leaked credential values and amend them out BEFORE push.
          bash .github/scripts/secret-guard.sh branch origin/ai/main
          # Rebase onto moved main before push (run 39488529938: branch born
          # from a stale base carried old workflow content — remote rejected
          # the ref creation). Converging with origin kills that class.
          git fetch origin ai/main || true
          git rebase origin/ai/main "${TURN_BRANCH:-ai/turn-orphan}" 2>/dev/null \
            || { git rebase --abort 2>/dev/null || true; echo "::warning::branch rebase skipped"; }
          git push origin "${TURN_BRANCH:-ai/turn-orphan}" || echo "::notice::no work branch to push"
          echo "branch=${TURN_BRANCH:-}" >> "$GITHUB_OUTPUT"
          CTL=agent-team/TEAM-CONTROL.org
          # REAL rotation (Owner 2026-10-22: member IDs are
          # PROVIDER/MODEL@PLATFORM; DUTY-ROLE LAW 18:55Z: QA is the
          # dedicated REVIEWER — OUT of the author rotation. Authors
          # cycle platform -> relief -> software -> platform; QA
          # segments happen only on Lead dispatch (audits), visiting
          # rejoins at software.
          case "${{ steps.control.outputs.seat }}" in
            platform-engineer)          NEXT="zai/glm-4.7-flash@goose (Relief Engineer)" ;;
            relief-engineer)            NEXT="deepseek-v4.1-flash@codebuddy (Software Engineer)" ;;
            software-engineer)          NEXT="qwen3.8-flash@qoder (Platform Engineer)" ;;
            quality-assurance-engineer) NEXT="qwen3.8-flash@qoder (Platform Engineer)" ;;
            visiting-engineer)          NEXT="deepseek-v4.1-flash@codebuddy (Software Engineer)" ;;  # visiting rejoins rotation; free burn continues
            *)                          NEXT="unknown (Lead: fix #+TURN in agent-team/TEAM-CONTROL.org)" ;;
          esac
          git checkout -f ai/main
          # Race-proof the control commit: the Lead's pushes or another
          # finalize can move ai/main while this segment ran — a plain push
          # would be rejected (fetch first) and the rotation pointer lost
          # (QA segment 15:57Z evidence). Reset to origin and re-apply.
          git fetch origin ai/main
          git reset --hard origin/ai/main
          sed -i "s|^\#+TURN:.*|\#+TURN: ${NEXT}|" "$CTL"
          git add "$CTL"
          git commit -m "ci-turn: ${TURN_SEAT:-unknown} done — next turn ${NEXT}" \
            -m "result: ${TURN_RESULT:-unknown}" || echo "::notice::nothing to commit"
          # Push retry (run 39485635406: the control push died silently —
          # the rotation pointer only survived by luck of the parked seat)
          CPUSH=no
          for i in 1 2 3; do
            if git push origin "ai/main"; then CPUSH=yes; break; fi
            git fetch origin ai/main && git reset --hard origin/ai/main
            sed -i "s|^\#+TURN:.*|\#+TURN: ${NEXT}|" "$CTL"
            git add "$CTL"
            git commit -m "ci-turn: ${TURN_SEAT:-unknown} done — next turn ${NEXT}" \
              -m "result: ${TURN_RESULT:-unknown}" || true
          done
          [ "$CPUSH" = "yes" ] || echo "::warning::control push failed after 3 attempts"

  # SELF-CHAIN — the last link of every turn (Owner order 2026-10-20 #hq
  # 14:52: unlimited runs, agents decide how many runs an objective takes).
  # After every segment (SEGREGATION LAW — Owner 2026-10-22 18:14Z:
  # "Separate author, reviewer and merger roles"; author ≠ reviewer ≠
  # merger):
  #   1. MERGER: resolve the pending branch's review verdict (reviewer =
  #      the NEXT seat's read-only review call in the turn job; same
  #      member as the author = refused) and merge into ai/main ONLY on
  #      APPROVED, behind the landing gate (re-merge race-proof vs moved
  #      main; branch deleted ONLY after a verified landing). The seat's
  #      OWN author branch is never merged by its own run — it becomes
  #      the next #+PENDING-REVIEW. Team chat and board notes propagate
  #      with the branch merge (TEAM-CHAT.org is union-merged via
  #      .gitattributes). Red work never lands (merge undone, branch
  #      stays). Review records: agent-team/REVIEW-LOG.org.
  #   2. Jev judgment (health-gated): weighs the stall state for the
  #      dispatch decision; gateway down -> local rules decide.
  #   3. Advance #+STALL-COUNT: +1 on a no-progress segment (dead seat,
  #      BLOCKED, conflict, gate red), reset to 0 when work lands.
  #   4. DISPATCH the next run itself while the objective is open and the
  #      kill switch is OFF. The chain stops ONLY on: KILL-SWITCH ON,
  #      OBJECTIVE-STATE COMPLETE, no objective. A no-progress streak
  #      (stall >= 4) does NOT kill the chain — it shifts to BACKOFF (next
  #      dispatch delayed 5 min per cycle) so a recovering lane is picked
  #      up automatically and the team keeps working.
  finalize:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [test, turn]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ai/main

      - name: Merger — resolve the pending branch's review verdict (SEGREGATION LAW)
        id: merge
        run: |
          git config user.name "agent-team-ci"
          git config user.email "agent-team-ci@users.noreply.github.com"
          git remote set-url --push origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          # SEGREGATION LAW (Owner 18:14Z): the merger NEVER merges this
          # run's own author branch — it merges the PREVIOUS run's pending
          # branch ONLY on the duty reviewer's APPROVED verdict, and
          # refuses a reviewer who is the author or not the duty
          # reviewer (DUTY-ROLE LAW, Owner 18:55Z: the review duty
          # belongs to the QA ENGINEER role — or the VISITING SENIOR
          # when QA authored the branch; merge authority is the LEAD's,
          # this gate is its execution arm).
          AUTHOR_BRANCH="${{ needs.turn.outputs.turn_branch }}"
          PENDING_BRANCH="${{ needs.turn.outputs.pending_branch }}"
          PENDING_AUTHOR="${{ needs.turn.outputs.pending_author }}"
          VERDICT="${{ needs.turn.outputs.review_verdict }}"
          REVIEW_MEMBER="${{ needs.turn.outputs.review_member }}"
          QA_MEMBER="groq/qwen3.8-27b@goose"  # Owner rotation 2026-10-25 (review-missing x17 evidence; demoted lane = qoder fallback in turn_segment.sh)
          VISITING_MEMBER="glm-5.3@codebuddy"
          # DURABILITY FIX (night-watch 2026-10-22 ~20:50Z, measured: run
          # 39846623548's seg step timed out mid-review at 20:35:52 after a
          # hung qoder review call — the empty turn outputs made this gate
          # believe "no-pending" and the control write WIPED the queued
          # branch ai/turn-20261022-1904 unreviewed). The merger re-reads
          # the slot straight from TEAM-CONTROL.org before believing an
          # empty turn parse; an unreviewed re-read slot then resolves to
          # review-missing and is RETAINED, never dropped.
          if [ -z "$PENDING_BRANCH" ]; then
            SLOT="$(grep -E '^#\+PENDING-REVIEW:' agent-team/TEAM-CONTROL.org | head -1 | sed 's/^#+PENDING-REVIEW:[[:space:]]*//' | xargs || true)"
            if [ -n "$SLOT" ]; then
              PENDING_BRANCH=$(printf '%s' "$SLOT" | sed -n 's/.*branch=\([^|]*\).*/\1/p' | xargs)
              PENDING_AUTHOR=$(printf '%s' "$SLOT" | sed -n 's/.*author=\([^|]*\).*/\1/p' | xargs)
              PENDING_SHA=$(printf '%s' "$SLOT" | sed -n 's/.*sha=\([0-9a-f]*\).*/\1/p' | xargs)
              echo "MERGER: turn outputs empty — slot re-read from TEAM-CONTROL.org: branch=${PENDING_BRANCH:-none}"
            fi
          fi
          # Expected duty reviewer by law, given who authored. AUTHOR-ID
          # FORMAT FIX (night-watch 2026-10-22 ~20:15Z): PENDING_AUTHOR is a
          # SEAT KEY (quality-assurance-engineer) — the old member-id-only
          # comparison never matched, so the gate EXPECTED QA to review
          # QA's own branch and blessed the reviewer-equals-author
          # auto-rejections (REVIEW-LOG 19:46Z + 20:10Z). Match both forms.
          if [ "${PENDING_AUTHOR:-x}" = "quality-assurance-engineer" ] || [ "${PENDING_AUTHOR:-x}" = "$QA_MEMBER" ]; then EXPECTED_REVIEWER="$VISITING_MEMBER"; else EXPECTED_REVIEWER="$QA_MEMBER"; fi
          OUTCOME="no-pending"
          MERGE_TARGET=""
          if [ -n "$PENDING_BRANCH" ] && git ls-remote --exit-code --heads origin "$PENDING_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$PENDING_BRANCH" || true
            # BR-09 stale-slot-sha fix (Lead, night-2 2026-10-23): the slot
            # freezes the discovery-time sha; a re-delivery advances the tip
            # and the slot then names a dead tree (2227 carried sha=1a87144
            # while tip cfd29f9 sat under judgment — flagged by the software
            # seat's night-2 segment). Resolve the CURRENT tip so the control
            # write and the review brief always name the tree actually judged.
            SLOT_TIP=$(git ls-remote origin "refs/heads/$PENDING_BRANCH" 2>/dev/null | cut -f1 || true)
            if [ -n "$SLOT_TIP" ]; then PENDING_SHA="$SLOT_TIP"; fi
            # EMPTY-SEGMENT LAW (unchanged): zero commits beyond main =
            # husk, delete, never merge.
            AHEAD=$(git rev-list --count "origin/ai/main..origin/$PENDING_BRANCH" 2>/dev/null || echo 0)
            if [ "${AHEAD:-0}" -eq 0 ]; then
              OUTCOME="empty-segment"
              echo "MERGER: pending branch is an empty husk — deleting"
              git push origin --delete "$PENDING_BRANCH" || true
            elif [ -z "$VERDICT" ]; then
              # HONEST LANE LABEL (Lead cycle 10-l, run 40073828746 turn
              # job 120814481260 evidence): a provider-side substitution
              # ("Model ... is not available right now; using ... instead")
              # drifts the reviewer off-brief, the report loses the
              # VERDICT: token, and the old code recorded a bland
              # review-missing on a healthy-looking run. Label the
              # substituted lane as lane-dead; handling (retain + re-review)
              # is identical to review-missing.
              if [ "${{ needs.turn.outputs.review_lane_dead }}" = "1" ]; then
                OUTCOME="lane-dead"
                echo "MERGER: reviewer lane substituted, no parseable verdict — honest lane-dead, branch stays pending"
              else
                OUTCOME="review-missing"
                echo "MERGER: no verdict captured — branch stays pending for re-review"
              fi
            elif [ "$VERDICT" != "APPROVED" ]; then
              OUTCOME="rejected"
              echo "MERGER: reviewer REJECTED the branch — it does not land"
            elif [ "${PENDING_AUTHOR:-x}" = "${REVIEW_MEMBER:-y}" ] || { [ "${PENDING_AUTHOR:-x}" = "quality-assurance-engineer" ] && [ "${REVIEW_MEMBER:-y}" = "$QA_MEMBER" ]; } || { [ "${PENDING_AUTHOR:-x}" = "visiting-engineer" ] && [ "${REVIEW_MEMBER:-y}" = "$VISITING_MEMBER" ]; }; then
              OUTCOME="refused-same-member"
              echo "MERGER: reviewer equals author (${REVIEW_MEMBER}) — refuse by law"
            elif [ "${REVIEW_MEMBER:-}" != "$EXPECTED_REVIEWER" ]; then
              OUTCOME="refused-wrong-reviewer"
              echo "MERGER: verdict from ${REVIEW_MEMBER:-none} but duty reviewer is ${EXPECTED_REVIEWER} — refuse by law"
            else
              OUTCOME="approved"
              MERGE_TARGET="$PENDING_BRANCH"
            fi
          fi
          echo "branch=${MERGE_TARGET}" >> "$GITHUB_OUTPUT"
          echo "author_branch=${AUTHOR_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"
          # Resolved pending passthrough (durability fix): the control
          # write must retain the RE-READ slot when the turn parse died.
          echo "pending_branch=${PENDING_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "pending_author=${PENDING_AUTHOR}" >> "$GITHUB_OUTPUT"
          echo "pending_sha=${PENDING_SHA}" >> "$GITHUB_OUTPUT"
          echo "MERGER: pending=${PENDING_BRANCH:-none} verdict=${VERDICT:-none} reviewer=${REVIEW_MEMBER:-none} (duty: ${EXPECTED_REVIEWER}) -> $OUTCOME"

      - name: Landing gate, land the approved merge (race-proof vs moved main)
        id: gate
        if: steps.merge.outputs.outcome == 'approved'
        run: |
          pip install -r demo-backend/requirements.txt pytest
          pip install -e plugin
          BRANCH="${{ steps.merge.outputs.branch }}"
          # RACE PROOF (run 39485635406 evidence: the turn job's
          # control-file push landed between this job's fetch and push;
          # the gate push was rejected non-fast-forward AND the branch
          # was deleted — the segment's 73-turn work was orphaned).
          # Re-fetch + re-merge against moved main, push with retry;
          # the branch is deleted ONLY after a verified landing.
          RESULT=conflict
          for i in 1 2 3; do
            git fetch origin ai/main
            git reset --hard origin/ai/main
            if ! git merge --no-ff --no-edit "origin/$BRANCH"; then
              git merge --abort || true
              echo "attempt $i: merge conflict vs moved main — retrying"
              sleep 15
              continue
            fi
            # FOLD-GUARD (Lead 10-ci, run 40178324559 evidence): TEAM-CHAT.org is
            # union-merged (.gitattributes), and the union driver can silently eat
            # a stale-base append's entry header (1956 landed as 1e249f1 with 5
            # header lines gone -> CHAT-STRUCTURE red on main). chain_test_check's
            # exit rc is NOT a usable signal here (the standing historical-prefix
            # flood keeps rc=1 even on clean trees), so probe the signature only:
            # a fold-free merge adds ZERO CHAT-STRUCTURE grounds. File-capture +
            # separate grep: pipefail+set -e killed a finalize step this way once
            # already (run 39761029125 evidence, in-file comment below).
            python3 scripts/chain_test_check.py > /tmp/fold-guard-chat.txt 2>&1 || true
            if grep -q 'CHAT-STRUCTURE' /tmp/fold-guard-chat.txt; then
              git reset --hard origin/ai/main
              RESULT=fold
              echo "fold-guard: merged chat carries CHAT-STRUCTURE grounds — merge undone, branch kept for the Lead union-merge"
              break
            fi
            if bash .github/scripts/gate.sh; then
              bash .github/scripts/secret-guard.sh staged
              if git push origin "ai/main"; then RESULT=green; break; fi
              RESULT=push-retry
              sleep 15
            else
              git reset --hard origin/ai/main
              RESULT=red
              echo "gate red on attempt $i — merge undone, branch kept for the Lead"
              break
            fi
          done
          case "$RESULT" in
            green)
              echo "gate=green" >> "$GITHUB_OUTPUT"
              git push origin --delete "$BRANCH" || true ;;
            red)
              echo "gate=red-merge-undone" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "gate=conflict-branch-kept" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: SEGREGATION bookkeeping — record review, set next pending (merger law)
        id: segregate
        if: always()
        env:
          # PROVENANCE pass-through as ENV, not inline interpolation: the value is
          # a fragment of the reviewer CLI's own stdout, so it must never be
          # written into the script text. turn_segment.sh already whitelists it
          # to [A-Za-z0-9._:@-]; env is the second door.
          REVIEW_SUBSTITUTED: ${{ needs.turn.outputs.review_substituted }}
          REVIEW_SUB_BRAIN: ${{ needs.turn.outputs.review_sub_brain }}
        run: |
          git config user.name "agent-team-ci"
          git config user.email "agent-team-ci@users.noreply.github.com"
          git remote set-url --push origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          CTL=agent-team/TEAM-CONTROL.org
          RLOG=agent-team/REVIEW-LOG.org
          OUTCOME="${{ steps.merge.outputs.outcome }}"
          GATE="${{ steps.gate.outputs.gate }}"
          PENDING_BRANCH="${{ steps.merge.outputs.pending_branch || needs.turn.outputs.pending_branch }}"
          PENDING_AUTHOR="${{ steps.merge.outputs.pending_author || needs.turn.outputs.pending_author }}"
          PENDING_SHA="${{ steps.merge.outputs.pending_sha || needs.turn.outputs.pending_sha }}"
          VERDICT="${{ needs.turn.outputs.review_verdict }}"
          REVIEW_MEMBER="${{ needs.turn.outputs.review_member }}"
          SEAT="${{ needs.turn.outputs.seat }}"
          # 0615 IDENTITY STAMP (Lead 10-fg; TEST-T2 finding turn-20261026-0615):
          # 186 of 271 merger-outcome records carried `duty reviewer=unknown` —
          # indistinguishable from the 10 REAL lane deaths. When the turn gave no
          # identity, say WHY: designed skip -> skipped(mode=...), seg died ->
          # empty(seg step ...), ran and answered nothing -> unknown(turn-outputs-empty).
          # Blast radius measured: no harness reads the :REVIEWER: VALUE or the
          # `duty reviewer=` prose (all rg hits are comments/prose/source anchors);
          # no new OUTCOME literal (chain_slot_check roster untouched); stall law
          # untouched (PROGRESS gates on AUTHOR_BRANCH, not identity).
          SEG_OUTCOME="${{ needs.turn.outputs.seg_outcome }}"
          CONTROL_MODE="${{ needs.turn.outputs.mode }}"
          ID_STAMP="$REVIEW_MEMBER"
          if [ -z "$REVIEW_MEMBER" ]; then
            case "${SEG_OUTCOME:-unknown}" in
              success) ID_STAMP="unknown(turn-outputs-empty)" ;;
              skipped) ID_STAMP="skipped(mode=${CONTROL_MODE:-unknown})" ;;
              *)       ID_STAMP="empty(seg step ${SEG_OUTCOME:-unknown})" ;;
            esac
          fi
          AUTHOR_BRANCH="${{ steps.merge.outputs.author_branch }}"
          AUTHOR_ID=$(printf '%s' "$SEAT" | cut -d' ' -f1)
          OUT="$OUTCOME"
          [ "$OUTCOME" = "approved" ] && OUT="approved+gate-${GATE:-n/a}"
          # Reviewer-brain PROVENANCE (Lead 10-az..10-bj: five verdicts in a row
          # were judged by a provider-substituted model while the record said
          # lane_dead=0, i.e. the duty reviewer answered). This changes NO
          # outcome — a produced verdict remains a verdict — it only stops the
          # record from claiming a brain it cannot prove ran.
          SUB_NOTE="no"
          if [ "${REVIEW_SUBSTITUTED:-0}" = "1" ]; then
            SUB_NOTE="yes (${REVIEW_SUB_BRAIN:-unidentified} substituted)"
          fi
          # Which branch is pending NEXT? BOOTSTRAP LAW (platform-seat
          # TEST-T2, measured live 18:41Z — the slot could NEVER fill
          # from empty: the old write keyed on OUTCOME=approved, but
          # approved requires a pre-existing pending, so empty stayed
          # empty forever and no turn branch could ever be queued,
          # reviewed or landed). The park now keys on whether the OLD
          # pending is being RETAINED: retain-outcomes (review-missing /
          # lane-dead / refused-same-member / refused-wrong-reviewer) keep the SAME
          # branch queued for re-review; every resolved-or-empty slot
          # (no-pending, empty-segment, approved, rejected) takes THIS
          # run's author branch. Parked is NOT merged — the merger still
          # demands the duty reviewer's APPROVED verdict behind the
          # green landing gate. Single slot by design; overflow branches
          # are Lead-merged on audit.
          NEWPENDING=""
          if [ -n "$AUTHOR_BRANCH" ] && git ls-remote --exit-code --heads origin "$AUTHOR_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$AUTHOR_BRANCH" >/dev/null 2>&1 || true
            AHEAD=$(git rev-list --count "origin/ai/main..origin/$AUTHOR_BRANCH" 2>/dev/null || echo 0)
            if [ "${AHEAD:-0}" -gt 0 ] && [ "$OUTCOME" != "review-missing" ] && [ "$OUTCOME" != "lane-dead" ] && [ "$OUTCOME" != "refused-same-member" ] && [ "$OUTCOME" != "refused-wrong-reviewer" ]; then
              SHA=$(git rev-parse "origin/$AUTHOR_BRANCH")
              NEWPENDING="branch=${AUTHOR_BRANCH} | author=${AUTHOR_ID} | sha=${SHA}"
            fi
          fi
          if [ "$OUTCOME" = "approved" ] && [ "$GATE" != "green" ]; then
            NEWPENDING="branch=${PENDING_BRANCH} | author=${PENDING_AUTHOR} | sha=${PENDING_SHA}"
          fi
          if [ "$OUTCOME" = "review-missing" ] || [ "$OUTCOME" = "lane-dead" ] || [ "$OUTCOME" = "refused-same-member" ] || [ "$OUTCOME" = "refused-wrong-reviewer" ] || [ "$OUTCOME" = "rejected" ]; then
            # REJECTED branches stay queued for re-review / Lead audit —
            # REVIEW-LOG.org law 4 promised this; the code now honors it.
            NEWPENDING="branch=${PENDING_BRANCH} | author=${PENDING_AUTHOR} | sha=${PENDING_SHA}"
          fi
          # Race-proof control write (same fetch-reset-reapply flow as the
          # stall commit) — record + pending line ride ONE ci-review commit.
          for i in 1 2 3; do
            git fetch origin ai/main
            git reset --hard origin/ai/main
            if [ -n "$PENDING_BRANCH" ]; then
              WHEN=$(date -u '+%Y-%m-%d %a %H:%M UTC')
              {
                echo ""
                echo "* REVIEW ${PENDING_BRANCH} :${OUT}:"
                echo ":PROPERTIES:"
                echo ":AUTHOR: ${PENDING_AUTHOR:-unknown}"
                echo ":REVIEWER: ${ID_STAMP}"
                echo ":VERDICT: ${VERDICT:-none}"
                echo ":SUBSTITUTED: ${SUB_NOTE}"
                echo ":OUTCOME: ${OUT}"
                # HEAD-SHA ledger field (Lead 10-eg, the TEST-T2 corollary [5]
                # disposition queued since 2230: REVIEW-LOG carried 262
                # records, 0 shas — a verdict's evidence contract named a
                # branch but never the tree judged). PENDING_SHA is BR-09's
                # SLOT_TIP re-point (the CURRENT tip fetched before the
                # verdict, line ~900), so this names the tree actually
                # judged. Additive drawer field: no grader parses the field
                # set (chat_when_check grades stamps per record, floor-pinned
                # population; slot/verdict checks grade control behavior).
                echo ":HEAD-SHA: ${PENDING_SHA:-unknown}"
                echo ":WHEN: [${WHEN}]"
                echo ":END:"
                echo "  Merger outcome: ${OUT} (duty reviewer=${ID_STAMP}, verdict=${VERDICT:-none}, reviewer brain substituted=${SUB_NOTE}; merge authority: Lead, executed by this gate)."
              } >> "$RLOG"
            fi
            # NON-CLOBBER SLOT GUARD (Lead hardening of relief-seat patch
            # docs/pending-slot-fix.patch on ai/turn-20261022-2051; diagnosis
            # measured LIVE by the relief seat: the Lead's 0ace32e re-queue
            # of ai/turn-20261022-1904 (20:47:17Z) was blanked 20 seconds
            # later by this sed in 86d88ce — NEWPENDING was computed BEFORE
            # the reset --hard above re-imported a control file carrying the
            # Lead's newer slot). Judge the write against the slot as it is
            # NOW: a NON-EMPTY write is this run's earned park/retain and
            # writes (single-slot park law; overflow goes to Lead audit); an
            # EMPTY write clears only an EMPTY slot (no-op) or a slot still
            # holding the branch THIS RUN resolved (legit post-merge clear)
            # — it must never blank a slot a Lead re-queued under this run.
            CURSLOT="$(grep -E '^#\+PENDING-REVIEW:' "$CTL" | head -1 | sed 's/^#+PENDING-REVIEW:[[:space:]]*//' | xargs || true)"
            SLOTISOURS=0
            case "$CURSLOT" in "branch=${PENDING_BRANCH:-} |"*) SLOTISOURS=1 ;; esac
            if [ -n "$NEWPENDING" ] || [ -z "$CURSLOT" ] || { [ -n "${PENDING_BRANCH:-}" ] && [ "$SLOTISOURS" = "1" ]; }; then
              sed -i "s%^\#+PENDING-REVIEW:.*%\#+PENDING-REVIEW: ${NEWPENDING}%" "$CTL"
            else
              echo "SEGREGATION: slot '${CURSLOT}' changed under this run — empty write retained it"
            fi
            git add "$CTL" "$RLOG"
            if git commit -m "ci-review: ${OUT} (pending ${PENDING_BRANCH:-none}); next pending: ${NEWPENDING:-none}" 2>/dev/null; then
              if git push origin "ai/main"; then break; fi
            else
              break   # nothing changed — no pending and no record
            fi
            sleep 15
          done

      - name: Resolve gateway (override -> deployment -> local -> boot — Owner order 2026-10-22)
        if: always()
        env:
          GOMODEL_MASTER_KEY: ${{ secrets.GOMODEL_MASTER_KEY }}
          GOMODEL_GATEWAY_OVERRIDE: ${{ vars.GOMODEL_GATEWAY_URL }}
        run: |
          set -u
          # Owner resolution law (2026-10-22): 1) vars.GOMODEL_GATEWAY_URL
          # override wins when set; 2) https://ai.khalidrafi.tech — the
          # deployment; 3) http://localhost:8080 — an already-running
          # listener; 4) ONLY when nothing answers does the next step boot
          # gomodel inside the runner (nothing answers == no deployment is
          # active right now). Every tier uses the ping contract
          # (agent-team-gateway-ping): GET / -> 404/200 = UP, else down.
          # The judgment lane is BINARY and rides no provider chain: Jev
          # via the resolved gateway when it is up, else the chain decides
          # directly (local rules) — never red.
          SUMMARY="$GITHUB_STEP_SUMMARY"
          ping() {
            curl -s -o /dev/null -m 20 -w '%{http_code}' \
              -H "Authorization: Bearer ${GOMODEL_MASTER_KEY:-}" "$1/" || echo 000
          }
          if [ -n "${GOMODEL_GATEWAY_OVERRIDE:-}" ]; then
            echo "GOMODEL_GATEWAY_URL=${GOMODEL_GATEWAY_OVERRIDE}" >> "$GITHUB_ENV"
            echo "GOMODEL_BOOT=skip" >> "$GITHUB_ENV"
            echo "gateway: vars.GOMODEL_GATEWAY_URL override in force (${GOMODEL_GATEWAY_OVERRIDE}) — health step still gates it" >> "$SUMMARY"
            exit 0
          fi
          CODE=$(ping "https://ai.khalidrafi.tech")
          if [ "$CODE" = "404" ] || [ "$CODE" = "200" ]; then
            echo "GOMODEL_GATEWAY_URL=https://ai.khalidrafi.tech" >> "$GITHUB_ENV"
            echo "GOMODEL_BOOT=skip" >> "$GITHUB_ENV"
            echo "gateway: deployment UP at ai.khalidrafi.tech (HTTP $CODE) — in-runner boot skipped" >> "$SUMMARY"
            exit 0
          fi
          REMOTE_CODE="$CODE"
          CODE=$(ping "http://localhost:8080")
          if [ "$CODE" = "404" ] || [ "$CODE" = "200" ]; then
            echo "GOMODEL_GATEWAY_URL=http://localhost:8080" >> "$GITHUB_ENV"
            echo "GOMODEL_BOOT=skip" >> "$GITHUB_ENV"
            echo "gateway: local listener UP at localhost:8080 (HTTP $CODE) — in-runner boot skipped" >> "$SUMMARY"
            exit 0
          fi
          echo "GOMODEL_GATEWAY_URL=http://localhost:8080" >> "$GITHUB_ENV"
          echo "GOMODEL_BOOT=boot" >> "$GITHUB_ENV"
          echo "gateway: nothing answers (ai.khalidrafi.tech HTTP ${REMOTE_CODE}, localhost:8080 HTTP ${CODE}) — next step boots gomodel in-runner (last resort)" >> "$SUMMARY"
          exit 0

      - name: GoModel gateway up (inside the runner — Owner order 2026-10-22)
        if: always() && env.GOMODEL_BOOT != 'skip'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GOMODEL_MASTER_KEY: ${{ secrets.GOMODEL_MASTER_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          # Same provider-key pass as the turn-job boot block (see above).
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -u
          if [ -z "${GH_PAT:-}" ]; then
            echo "::warning::GH_PAT missing — cannot clone khaalidrafi/llmfisher for the gateway config; gomodel lane stays DOWN -> fallback (never red)"
            exit 0
          fi
          rm -rf /tmp/llmfisher-src
          git clone --quiet --depth 1 \
            "https://x-access-token:${GH_PAT}@github.com/khaalidrafi/llmfisher" \
            /tmp/llmfisher-src
          docker rm -f gomodel >/dev/null 2>&1 || true
          # Tuned env block = llmfisher docker-compose.yml gomodel service
          # verbatim (field types checked per the GoModel source; a wrong
          # shape is a crash loop, not a warning). Keys ride as env only
          # (env-var law): nothing baked, nothing printed, nothing in git.
          export JEV_API_KEY="${TYPESAFE_API_KEY:-}"
          docker run -d --name gomodel -p 127.0.0.1:8080:8080 \
            -v /tmp/llmfisher-src/config:/app/config:ro \
            -v gomodel_data:/app/data \
            -e SQLITE_PATH=/app/data/gomodel.db \
            -e CONFIGURED_PROVIDER_MODELS_MODE=allowlist \
            -e FAILOVER_RETRY_ON_STATUSES=4xx,5xx \
            -e FAILOVER_MAX_ATTEMPTS=5 \
            -e RETRY_MAX_RETRIES=3 \
            -e RETRY_INITIAL_BACKOFF=5s \
            -e CIRCUIT_BREAKER_SCOPE=model \
            -e HTTP_RESPONSE_HEADER_TIMEOUT=30 \
            -e CACHE_REFRESH_INTERVAL=21600 \
            -e PROVIDER_RECHECK_INTERVAL=300 \
            -e LOG_LEVEL=info \
            -e PROVIDER_PROMPT_CACHE_PLANNER_ENABLED=false \
            -e GOMODEL_DEMO_MODE=false \
            -e GOMODEL_MASTER_KEY -e JEV_API_KEY \
            -e ZAI_API_KEY -e GROQ_API_KEY -e OPENROUTER_API_KEY \
            enterpilot/gomodel >/dev/null
          ok=""
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -m 2 -w '%{http_code}' \
              -H "Authorization: Bearer ${GOMODEL_MASTER_KEY:-}" \
              "http://localhost:8080/" || echo 000)
            if [ "$CODE" = "404" ] || [ "$CODE" = "200" ]; then
              echo "GoModel gateway UP inside the runner (HTTP $CODE, ping contract)"
              ok=1; break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::warning::gomodel container did not answer in 30s — lane stays DOWN -> fallback (never red)"
            docker logs --tail 20 gomodel 2>&1 \
              | sed 's/[A-Za-z0-9+/=_-]\{20,\}/[redacted]/g' || true
          fi
          exit 0

      - name: Jev judgment (GoModel via llmfisher gateway — chain decision layer)
        if: always()
        env:
          GOMODEL_MASTER_KEY: ${{ secrets.GOMODEL_MASTER_KEY }}
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY"
          # Owner order (re-issued 2026-10-21 08:25Z): use gomodel via
          # khaalidrafi/llmfisher on CI. Jev (model jev-1.13.0, POST
          # /v1/systemone) is the chain's calibrated judgment layer — it
          # weighs the stall state for the dispatch decision. Payload
          # mirrors agent-team.el agent-team--jev-payload byte-for-byte.
          CODE=$(curl -s -o /dev/null -m 20 -w '%{http_code}' \
                  -H "Authorization: Bearer ${GOMODEL_MASTER_KEY}" \
                  "${GOMODEL_GATEWAY_URL}/" || echo 000)
          if [ "$CODE" != "404" ] && [ "$CODE" != "200" ]; then
            echo "jev: gateway DOWN (HTTP $CODE) — local rules decided the chain step (lane-fallback law; gomodel auto-resumes when the box answers)" >> "$SUMMARY"
            exit 0
          fi
          RESULT="${{ needs.turn.outputs.seg_result }}"
          OUTCOME="${{ steps.merge.outputs.outcome }}"
          STATE="stall state: segment result ${RESULT:-none}, merge outcome ${OUTCOME:-none}, CI chain deciding whether to dispatch the next turn now or back off."
          BODY=$(jq -nc --arg s "$STATE" \
            --arg q "Dispatch the next agent-team CI turn immediately (yes) or back off (no)?" \
            '{state: $s, model: "jev-1.13.0", questions: {q: {type: "noul", instructions: $q}}}')
          RESP=$(curl -s -m 90 -X POST \
                  -H "Authorization: Bearer ${GOMODEL_MASTER_KEY}" \
                  -H "Content-Type: application/json" \
                  -d "$BODY" \
                  "${GOMODEL_GATEWAY_URL}/v1/systemone" || echo '{}')
          P=$(echo "$RESP" | jq -r '.answers.q.noul // empty' 2>/dev/null)
          if [ -n "$P" ]; then
            VERDICT=$(awk -v p="$P" 'BEGIN{print (p>=0.5) ? "yes" : "no"}')
            echo "jev: ${P} -> ${VERDICT} (gomodel via llmfisher gateway, HTTP $CODE)" >> "$SUMMARY"
          else
            echo "jev: gateway answered but no noul in response — local rules decided (never block the chain on a judgment lane)" >> "$SUMMARY"
          fi

      - name: Stall accounting + dispatch the next run (self-chain)
        run: |
          CTL=agent-team/TEAM-CONTROL.org
          RESULT="${{ needs.turn.outputs.seg_result }}"
          OUTCOME="${{ steps.merge.outputs.outcome }}"
          GATE="${{ steps.gate.outputs.gate }}"
          STALL=$(grep -oP '^\#\+STALL-COUNT:\s*\K\d+' "$CTL" | head -1 || true); STALL=${STALL:-0}
          # LEAD FIX (BR-07, 2026-10-23): a Lead-armed #+CHAIN-PAUSE must
          # stop the SELF-DISPATCH too — the turn job honors it (mode=paused)
          # but finalize kept dispatching: stall 28 -> 137, ~109 no-work runs
          # burned during the 2026-10-23 day. Same grammar as the turn
          # control step: any non-empty value pauses except literal "OFF".
          CHAINPAUSE=$(grep -oP '^\#\+CHAIN-PAUSE:\s*\K.*' "$CTL" | head -1 | xargs || true)
          CHAIN_PAUSED=no
          if [ -n "$CHAINPAUSE" ] && ! printf '%s' "$CHAINPAUSE" | grep -qi '^off$'; then
            CHAIN_PAUSED=yes
          fi
          # PROGRESS under SEGREGATION LAW (Owner 18:14Z): a green approved
          # merge is progress; so is a REAL authored branch (non-empty,
          # awaiting next-run review — the merge lands one run later).
          AUTHOR_AHEAD=0
          AUTHOR_BRANCH="${{ steps.merge.outputs.author_branch }}"
          if [ -n "$AUTHOR_BRANCH" ] && git ls-remote --exit-code --heads origin "$AUTHOR_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$AUTHOR_BRANCH" >/dev/null 2>&1 || true
            AUTHOR_AHEAD=$(git rev-list --count "origin/ai/main..origin/$AUTHOR_BRANCH" 2>/dev/null || echo 0)
          fi
          PROGRESS=no
          if [ "$OUTCOME" = "approved" ] && [ "$GATE" = "green" ]; then PROGRESS=yes; fi
          if [ "${AUTHOR_AHEAD:-0}" -gt 0 ]; then PROGRESS=yes; fi
          case "$RESULT" in *BLOCKED*) PROGRESS=no ;; esac
          if [ "$PROGRESS" = "yes" ]; then NEW=0; else NEW=$((STALL+1)); fi
          # BR-07: a paused chain is not "working with no progress" — the
          # turn did not run, so the stall counter freezes while paused.
          if [ "$NEW" != "$STALL" ] && [ "$CHAIN_PAUSED" = "no" ]; then
            # Race-proof (Lead pushes can move ai/main mid-run — same class
            # as the 15:57Z fetch-first rejection): reset, re-apply, commit.
            git fetch origin ai/main
            git reset --hard origin/ai/main
            sed -i "s|^\#+STALL-COUNT:.*|\#+STALL-COUNT: ${NEW}|" "$CTL"
            git add "$CTL"
            git commit -m "ci-chain: stall=${NEW} (segment ${OUTCOME}, result ${RESULT:-none})" \
              || echo "::notice::stall commit empty"
            git push origin "ai/main" || echo "::warning::stall push failed"
          fi
          # Decide the next link in the chain
          KILL=$(grep -oP '^\#\+KILL-SWITCH:\s*\K\w+' "$CTL" | head -1 || true)
          OBJSTATE=$(grep -oP '^\#\+OBJECTIVE-STATE:\s*\K\w+' "$CTL" | head -1 || true)
          OBJECTIVE=$(grep -oP '^\#\+OBJECTIVE:\s*\K.*' "$CTL" | head -1 || true)
          DECISION="dispatch"
          if [ "${KILL:-OFF}" = "ON" ]; then DECISION="kill-switch"; fi
          if [ "${OBJSTATE:-OPEN}" = "COMPLETE" ]; then DECISION="objective-complete"; fi
          if [ -z "$OBJECTIVE" ] || echo "$OBJECTIVE" | grep -q "the Owner writes"; then
            DECISION="no-objective"
          fi
          # Tests red = no agent can even run (turn needs a green suite):
          # chaining would spin red forever. Halt and page the Lead.
          if [ "${{ needs.test.result }}" = "failure" ]; then
            DECISION="tests-red-halt"
          fi
          if [ "$NEW" -ge 4 ] && [ "$DECISION" = "dispatch" ]; then
            DECISION="backoff-dispatch"   # slow-poll: transient dead lanes recover on their own
          fi
          # BR-07: an armed #+CHAIN-PAUSE overrides any dispatch decision
          # (kill-switch / tests-red / objective states still win above).
          if [ "$CHAIN_PAUSED" = "yes" ]; then
            case "$DECISION" in
              dispatch|backoff-dispatch) DECISION="chain-paused" ;;
            esac
          fi
          # BR-01 hard floor (Lead 2026-10-23): a dead-lane backoff may not
          # poll forever — at stall 12 (~1h of 5-min polls) the chain arms
          # #+CHAIN-PAUSE ITSELF with a dated reason and halts. The Lead
          # (or Owner) diagnoses lanes, then clears the line to resume.
          if [ "$NEW" -ge 12 ] && [ "$DECISION" = "backoff-dispatch" ]; then
            DECISION="stall-halt"
            git fetch origin ai/main
            git reset --hard origin/ai/main
            grep -q '^#+CHAIN-PAUSE:' "$CTL" || printf '#+CHAIN-PAUSE:\n' >> "$CTL"
            sed -i "s|^#+CHAIN-PAUSE:.*|#+CHAIN-PAUSE: armed $(date -u '+%Y-%m-%d %H:%M')Z — AUTO stall-halt at stall=${NEW}: 12+ no-progress backoff segments; diagnose lanes, then clear this line to resume|" "$CTL"
            git add "$CTL"
            git commit -m "ci-chain: AUTO stall-halt armed at stall=${NEW} (BR-01 hard floor)" || true
            git push origin "ai/main" || echo "::warning::stall-halt push failed — next run re-arms"
          fi
          # PAUSE-AFTER-TODO (Owner order 2026-10-22 #admincraft: "After
          # completing a TODO, pause and summarize which role did what"):
          # a segment that DELIVERS a TODO (a :DELIVERED: evidence line
          # landed on the board) halts the chain — no self-dispatch — and
          # arms #+CHAIN-PAUSE. The seat's role report already reached the
          # Owner via the chat mirror below; the Lead reviews, then clears
          # the marker to resume. Tests-red / kill-switch always win first.
          PAUSELAW=$(grep -oP '^\#\+PAUSE-AFTER-TODO:\s*\K\w+' "$CTL" | head -1 || true)
          if [ "${PAUSELAW:-OFF}" = "ON" ] && [ "$PROGRESS" = "yes" ] && [ "$DECISION" = "dispatch" ]; then
            BASE="${{ needs.turn.outputs.base_sha }}"
            if [ -n "$BASE" ] && git cat-file -e "$BASE" 2>/dev/null; then
              DELIV=$(git diff "$BASE" HEAD -- agent-team/TODOS.org 2>/dev/null | grep -c '^+.*:DELIVERED:' || true)
              if [ "${DELIV:-0}" -gt 0 ]; then
                DECISION="paused-todo-review"
              fi
            fi
          fi
          # Export for the Telegram mirror step below (same job, later step).
          echo "CHAIN_DECISION=$DECISION" >> "$GITHUB_ENV"
          echo "CHAIN_STALL=$NEW" >> "$GITHUB_ENV"
          # Arm the pause marker on a delivered TODO (race-proof: same
          # fetch-reset-reapply flow as the stall commit above).
          if [ "$DECISION" = "paused-todo-review" ]; then
            git fetch origin ai/main
            git reset --hard origin/ai/main
            grep -q '^#+CHAIN-PAUSE:' "$CTL" || printf '#+CHAIN-PAUSE:\n' >> "$CTL"
            sed -i "s|^#+CHAIN-PAUSE:.*|#+CHAIN-PAUSE: armed $(date -u '+%Y-%m-%d %H:%M')Z — a TODO was delivered; the Lead clears this line to resume|" "$CTL"
            git add "$CTL"
            git commit -m "ci-chain: pause-after-TODO armed (Owner order 2026-10-22)" || true
            git push origin "ai/main" || echo "::warning::pause marker push failed — the Lead arms it manually"
          fi
          DISPATCH_CODE="n/a"
          if [ "$DECISION" = "dispatch" ] || [ "$DECISION" = "backoff-dispatch" ]; then
            if [ "$DECISION" = "backoff-dispatch" ]; then
              echo "backoff: lane dead ${NEW} segments straight — waiting 5 min before the next attempt"
              sleep 300
            else
              sleep 20   # let the control push settle; the concurrency group serializes anyway
            fi
            DISPATCH_CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/agent-team.yml/dispatches" \
              -d '{"ref":"ai/main"}')
          fi
          SUMMARY="$GITHUB_STEP_SUMMARY"
          echo "## Chain — finalize" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "- merge: ${OUTCOME} (${{ steps.merge.outputs.branch }})" >> "$SUMMARY"
          echo "- landing gate: ${GATE:-skipped}" >> "$SUMMARY"
          echo "- stall count: ${NEW} (>=4 = 5-min backoff mode)" >> "$SUMMARY"
          echo "- chain decision: **${DECISION}** (dispatch HTTP ${DISPATCH_CODE})" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "kill=${KILL:-OFF} state=${OBJSTATE:-OPEN}" >> "$SUMMARY"

      # Owner channel — OUTBOUND leg (Owner order 2026-10-21 #hq: contact
      # over Telegram; 17:47Z: locked to HIS chat id). Mirrors every chain
      # verdict to the Owner's chat ONLY: TELEGRAM_OWNER_ID secret, else
      # TELEGRAM_CHAT_ID, else the owner-locked learned id (tg_chat
      # output — it only ever carries the verified Owner id). SILENT until
      # the lock is activated by the Lead.
      - name: Mirror chain verdict + GLM chat to Telegram (owner-locked, deduped)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_LEARNED_CHAT: ${{ needs.turn.outputs.tg_chat }}
        run: |
          # OWNER LOCK (17:47Z): verdicts go ONLY to the Owner's chat —
          # secret id first, then the owner-locked learned id. No other
          # destination exists.
          # TG DEDUPE LAW (Owner 2026-10-21 03:53Z: "I keep getting the
          # same msgs on Telegram"): fire ONLY when a segment actually
          # RAN and the verdict differs from #+LAST-VERDICT in the
          # control file. Hourly safety-net no-ops are silent.
          SEG="${{ needs.turn.outputs.seg_result }}"
          [ -n "$SEG" ] || { echo "telegram mirror: turn skipped — silent (dedupe law)"; exit 0; }
          CHAT="${TELEGRAM_OWNER_ID:-${TELEGRAM_CHAT_ID:-${TG_LEARNED_CHAT}}}"
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$CHAT" ] || { echo "telegram mirror: silent (no token or chat id yet)"; exit 0; }
          CTL=agent-team/TEAM-CONTROL.org
          # GLM CHAT MIRROR (Owner 2026-10-21 #hq: "I can't see team chat
          # on Telegram — it keeps sending FROM: team-lead msgs"): the
          # segment's NEW TEAM-CHAT.org entries go to the Owner too, each
          # block under its REAL :FROM: seat — verdicts alone made the
          # feed look like a team-lead monologue. Char-safe chunking under
          # TG's 4096 cap; deduped via #+LAST-CHAT (a re-run diffs the
          # same segment -> same hash -> silent). Runs BEFORE the BLOCKED
          # verdict cap so chat flows even when the verdict is throttled.
          ADDED=""
          BASE="${{ needs.turn.outputs.base_sha }}"
          if [ -n "$BASE" ] && git cat-file -e "$BASE" 2>/dev/null; then
            # || true: grep exits 1 on an EMPTY diff (segment appended no
            # chat lines) and pipefail killed this step silently under
            # set -e (run 39761029125 T3 finalize, step 7 evidence).
            ADDED=$(git diff "$BASE" HEAD -- agent-team/TEAM-CHAT.org 2>/dev/null \
              | grep '^+' | grep -v '^+++' | sed 's/^+//' || true)
          fi
          CH=""
          if [ -n "$ADDED" ]; then
            CH=$(printf '%s' "$ADDED" | sha256sum | cut -c1-12)
            LASTC=$(grep -oP '^\#\+LAST-CHAT:\s*\K[0-9a-f]+' "$CTL" | head -1 || true)
            if [ "$CH" != "$LASTC" ]; then
              SEAT=$(printf '%s\n' "$ADDED" | grep -oP '^\s*:FROM:\s*\K.*' | head -1 || true)
              SEAT="${SEAT:-team-lead}"
              export ADDED
              python3 -c 'import os,sys; added=os.environ["ADDED"]; sys.stdout.write("\x1f".join(added[i:i+3800] for i in range(0, len(added), 3800)))' > /tmp/tg-chunks.txt
              while IFS= read -r -d $'\x1f' CHUNK || [ -n "$CHUNK" ]; do
                [ -n "$CHUNK" ] || continue
                curl -sS -o /dev/null -w 'telegram chat mirror: HTTP %{http_code}\n' \
                  "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                  --data-urlencode "chat_id=${CHAT}" \
                  --data-urlencode "text=$(printf 'FROM: %s\nTO: @owner\n\n[admincraft] team chat — new this segment\n---\n%s' "$SEAT" "$CHUNK")" || true
                CHUNK=""
              done < /tmp/tg-chunks.txt
              rm -f /tmp/tg-chunks.txt
            else
              echo "telegram chat mirror: already mirrored this segment — silent (dedupe)"
            fi
          else
            echo "telegram chat mirror: no new chat entries this segment"
          fi
          case "$SEG" in
            *BLOCKED*)
              # DEDUPE LAW v2 (Owner 2026-10-21 05:24Z: the same BLOCKED msg
              # kept arriving every ~5 min): a BLOCKED situation pages the
              # Owner AT MOST ONCE PER HOUR. Seat wording and the stall
              # counter never reset the cap — only a real state change or
              # the hourly heartbeat does. DONE/PARTIAL (fresh work) is
              # NEVER throttled.
              NOW=$(date +%s)
              LASTB=$(grep -oP '^\#\+LAST-BLOCKED-NOTIFY:\s*\K[0-9]+' "$CTL" | head -1 || true)
              [ -n "$LASTB" ] || LASTB=0
              if [ "$((NOW - LASTB))" -lt 3600 ]; then
                echo "telegram mirror: BLOCKED already mirrored <1h ago — silent (dedupe law v2)"
                exit 0
              fi
              ;;
          esac
          VH=$(printf '%s' "$SEG" | sha256sum | cut -c1-12)
          # TELEGRAM LAW (Owner order 17:55Z): every message to the TG bot
          # MUST contain FROM and TO — they open the text.
          TXT="$(printf 'FROM: team-lead (glm-5.3-flash, Agent Team @khaalidrafi/admincraft)\nTO: @owner\n\n[admincraft] segment done\nbranch: %s\nseat: %s\nresult: %s\nmerge: %s\ngate: %s\nstall: %s\ndecision: %s' \
            "${{ needs.turn.outputs.turn_branch }}" \
            "${{ needs.turn.outputs.seat }}" \
            "$SEG" \
            "${{ steps.merge.outputs.outcome }}" \
            "${{ steps.gate.outputs.gate }}" \
            "${CHAIN_STALL:-?}" \
            "${CHAIN_DECISION:-unknown}")"
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=${TXT}") || CODE="curl-failed"
          echo "telegram mirror: HTTP ${CODE}"
          git config user.name "agent-team-ci" 2>/dev/null || true
          git config user.email "agent-team-ci@users.noreply.github.com" 2>/dev/null || true
          git remote set-url --push origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          # SED BUG FIX (root cause of the 5-min TG spam): the old pattern
          # '^\#\+LAST-VERDICT:' is GNU BRE — '\+' = one-or-more of '#', so it
          # NEVER matched the org line '#+LAST-VERDICT:' (literal '#' then
          # '+'). sed no-oped -> empty commit -> exit 0 -> the marker never
          # landed on ai/main -> every run re-mirrored. Fixed: '^#+...'.
          write_markers() {
            grep -q '^#+LAST-BLOCKED-NOTIFY:' "$CTL" || printf '#+LAST-BLOCKED-NOTIFY: 0\n' >> "$CTL"
            sed -i "s|^#+LAST-VERDICT:.*|#+LAST-VERDICT: ${VH}|" "$CTL"
            if [ -n "${CH:-}" ]; then
              grep -q '^#+LAST-CHAT:' "$CTL" || printf '#+LAST-CHAT: 0\n' >> "$CTL"
              sed -i "s|^#+LAST-CHAT:.*|#+LAST-CHAT: ${CH}|" "$CTL"
            fi
            case "$SEG" in
              *BLOCKED*) sed -i "s|^#+LAST-BLOCKED-NOTIFY:.*|#+LAST-BLOCKED-NOTIFY: $(date +%s)|" "$CTL" ;;
            esac
          }
          git fetch origin ai/main && git reset --hard origin/ai/main
          write_markers
          git add "$CTL"
          git commit -m "ci-chain: verdict ${VH} mirrored" || exit 0
          # Lead fix 2026-10-22 (runs 39747548417..39752778724 evidence):
          # this step's push lost 3x races vs concurrent runs and its exit 1
          # painted every healthy run "failure". Mirror markers are
          # bookkeeping, not the chain verdict — a lost marker may re-mirror
          # one deduped message once; it must NEVER fail the run.
          PUSH_OK=no
          for i in 1 2 3; do
            if git push origin "ai/main"; then PUSH_OK=yes; break; fi
            git fetch origin ai/main && git reset --hard origin/ai/main
            write_markers
            git add "$CTL"
            git commit -m "ci-chain: verdict ${VH} mirrored" || break
          done
          [ "$PUSH_OK" = "yes" ] || echo "::warning::verdict markers not persisted (non-fatal; dedupe may re-mirror once)"
          exit 0

      # Owner order 2026-10-20 19:56Z: "You serve as the lead of both repos.
      # Their GLM chats go to their respective Discord channels." This
      # project's channel webhook rides as secret DISCORD_WEBHOOK_TEAM_ADMINCRAFT (the
      # Owner creates it in one click in the channel settings). Mirrors
      # (1) the chain verdict and (2) every TEAM-CHAT.org message this
      # segment appended — the GLM chats — diffed base_sha..post-merge
      # HEAD. SILENT until the webhook secret exists. FROM/TO law applies
      # to every mirrored block.
      - name: Mirror verdict + new GLM chats to Discord (silent without secret)
        env:
          DISCORD_WEBHOOK_TEAM: ${{ secrets.DISCORD_WEBHOOK_TEAM_ADMINCRAFT }}
          BASE_SHA: ${{ needs.turn.outputs.base_sha }}
          TURN_BRANCH: ${{ needs.turn.outputs.turn_branch }}
          SEG_RESULT: ${{ needs.turn.outputs.seg_result }}
        run: |
          [ -n "$DISCORD_WEBHOOK_TEAM" ] || { echo "discord mirror: silent (no DISCORD_WEBHOOK_TEAM_ADMINCRAFT secret yet)"; exit 0; }
          post() { # chunk to Discord's 2000-char cap
            local txt="$1"
            while [ -n "$txt" ]; do
              local chunk="${txt:0:1900}"; txt="${txt:1900}"
              curl -sS -o /dev/null -w 'discord mirror: HTTP %{http_code}\n' \
                "$DISCORD_WEBHOOK_TEAM" \
                -H 'Content-Type: application/json' \
                -d "$(python3 -c 'import json,sys; print(json.dumps({"content": sys.stdin.read()}))' <<< "$chunk")" || true
            done
          }
          FROM="FROM: team-lead (glm-5.3-flash, Agent Team @khaalidrafi/admincraft)"
          post "$(printf '%s\nTO: @team (discord, admincraft channel)\n\n[admincraft] segment done\nbranch: %s\nresult: %s\ndecision: %s\nstall: %s' \
            "$FROM" "${TURN_BRANCH:-?}" "${SEG_RESULT:-?}" "${CHAIN_DECISION:-unknown}" "${CHAIN_STALL:-?}")"
          # The GLM chats this segment appended (merge landed them in ai/main):
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
            # || true: same empty-diff pipefail hazard as the TG mirror
            # (Lead fix 2026-10-22, run 39761029125 evidence).
            ADDED=$(git diff "$BASE_SHA" HEAD -- agent-team/TEAM-CHAT.org 2>/dev/null \
              | grep '^+' | grep -v '^+++' | sed 's/^+//' || true)
            if [ -n "$ADDED" ]; then
              post "$(printf '%s\nTO: @team (discord, admincraft channel)\n--- GLM chat, this segment ---\n%s' "$FROM" "$ADDED")"
            else
              echo "discord mirror: no new chat entries this segment"
            fi
          else
            echo "discord mirror: base sha unavailable — verdict only"
          fi
