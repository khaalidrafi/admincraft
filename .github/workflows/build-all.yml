# build-all -- the E2 CI pipeline (E2/CI-1, 2026-10-17).
#
# One pipeline, two phases:
#   1. test-gate runs FIRST: vitest (app/, 51 tests) + pytest (plugin/, 53
#      tests, fixture = demo-backend). Every build leg `needs:` it, so a red
#      tree never spends build minutes.
#   2. build legs: web / windows / linux / android / nix / guix, each
#      uploading an artifact users can play against their own DRF API (see
#      demo-backend/ for a 60-second local backend, admin/admin123).
#   3. on v* tag pushes: the `release` job attaches this run's artifacts
#      plus the plugin wheel/sdist to a GitHub Release (assets always match
#      the tagged source). v0.1.0 was cut by hand from run 39000890302 with
#      the exact same rules -- scripts/cut_v010_release.sh is the reference.
#
# Reused from the parked .github/workflows/build-demo.yml.disabled:
#   - web/windows/linux/android/nix/guix steps carried over nearly verbatim
#     (only the `lockfile` job is gone -- Cargo.lock is committed and
#     tracked since 601bc17, so every leg just checks out the pushed ref).
#   - android leg re-enabled per E2 request (never verified while parked --
#     three failed dispatches, iteration notes in AI-REVIEW.org P3).
#   - nix: flake.nix already sets doCheck = false, so `nix build` runs no
#     cargo tests -- exactly what the E2 spec allows.
#   - guix: repo carries NO channel file (channels.scm absent), so `guix
#     pull` resolves current channels -- nothing pinned. Expect ~15 min of
#     pull before the build.
#   - deb bundle dropped from the linux leg (spec wants .AppImage only).
#
# Triggers: push + pull_request on ai/main, plus workflow_dispatch for
# manual runs from any branch (Actions tab -> Run workflow; paid minutes
# on this private repo -- use sparingly). Pushing a v* tag runs the same
# pipeline and the release job below cuts the GitHub Release from that
# run's artifacts. Per the GitHub docs, defining both branches and tags
# filters under `push:` means the workflow fires when EITHER matches, so
# plain pushes to ai/main are unaffected. Pushing ai/* feature branches
# otherwise costs zero minutes. No new secrets: the nix leg uses the
# built-in GITHUB_TOKEN for tarball fetches, and the release job elevates
# only its own job-level permission to contents:write. The old
# build-demo.yml.disabled stays inert (Actions ignores non-*.yml files in
# .github/workflows/).

name: build-all

on:
  workflow_dispatch:
  push:
    branches: [ai/main]
    tags: ['v*']
  pull_request:
    branches: [ai/main]

permissions:
  contents: read

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------- test-gate ---
  # The gate. vitest first (app/), then pytest (plugin/ with the demo
  # backend as fixture: pip install -e plugin[test] + demo requirements,
  # run from the repo root). Both suites must pass before any build runs.
  test-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: vitest -- app unit suite
        working-directory: app
        env:
          NODE_OPTIONS: --max-old-space-size=1024
        run: |
          npm ci --no-audit --no-fund
          npx vitest run --maxWorkers=1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: demo-backend/requirements.txt
      - name: pytest -- plugin suite (demo backend as fixture)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "plugin[test]" -r demo-backend/requirements.txt
          python -m pytest plugin/tests

  # ------------------------------------------------------------------ web ---
  # Static web bundle. Serve dist/ statically, open it, log in with your
  # DRF API URL + token credentials. Also feeds the nix and guix legs.
  web:
    needs: test-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build web bundle
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: app/dist/
          retention-days: 14
          if-no-files-found: error

  # -------------------------------------------------------------- windows ---
  windows:
    needs: test-gate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Build Windows setup (NSIS .exe)
        working-directory: app
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------- linux ---
  # AppImage only (the parked leg's .deb bundle is dropped per spec).
  linux:
    needs: test-gate
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux webview deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Build Linux .AppImage
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npx tauri build --bundles appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: app/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14
          if-no-files-found: error

  # -------------------------------------------------------------- android ---
  # Debug-signed UNIVERSAL APK (aarch64 + armv7), sideloadable on any
  # Android 7.0+ phone, 64- or 32-bit. v0.1.0 shipped aarch64-only and
  # died with "app not installed" on 32-bit devices; every runner also
  # minted a fresh debug key per run, so no build could update over
  # another. Both fixed: both rust targets, and the committed
  # app/src-tauri/signing/debug.keystore copied over the ephemeral
  # ~/.android/debug.keystore so the signature is identical every run.
  # No android-actions/setup-android: it chokes installing the deprecated
  # `tools` package. GitHub runners already ship the SDK (ANDROID_HOME)
  # with licenses pre-accepted -- we only add the NDK.
  android:
    needs: test-gate
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install NDK into the preinstalled SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;27.0.12077973" | tail -n 2
          test -d "$ANDROID_HOME/ndk/27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Install the stable debug signing keystore
        run: |
          mkdir -p "$HOME/.android"
          cp app/src-tauri/signing/debug.keystore "$HOME/.android/debug.keystore"
          # Cert fingerprint into the log for cross-checking apksigner below.
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android | grep -E '^Alias name|^SHA256:' | head -n 2
      - name: Build Android APK (debug-signed, aarch64 + armv7)
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npx tauri android init
          npx tauri android build --apk --debug --target aarch64,armv7
      - name: Verify APK (stable signer + both ABIs present)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          APK=$(ls app/src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk)
          echo "apk: $APK"
          "$APKSIGNER" verify --print-certs "$APK"
          echo "--- ABI coverage (must be > 0 for both) ---"
          for abi in arm64-v8a armeabi-v7a; do
            n=$(unzip -l "$APK" | grep -c "lib/$abi/")
            echo "lib/$abi entries: $n"
            test "$n" -gt 0
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 14
          if-no-files-found: error

  # ------------------------------------------------------------------ nix ---
  # Per the nixpkgs manual (Rust chapter): buildRustPackage + cargoLock,
  # deps vendored straight from Cargo.lock. The web bundle from the `web`
  # leg is passed as the `frontend-dist` flake input. flake.nix sets
  # doCheck = false, so this builds without running cargo tests.
  nix:
    needs: [test-gate, web]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: app/dist
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
      - name: Build via flake
        run: |
          FRONTEND=$(nix store add-path --name frontend-dist app/dist)
          nix build --print-build-logs \
            --override-input frontend-dist "path:$FRONTEND" \
            .#admincraft
      - name: Pack result
        run: |
          storepath=$(realpath result)
          tar -czf admincraft-nix.tar.gz -C / "$storepath"
      - uses: actions/upload-artifact@v4
        with:
          name: nix-out
          path: admincraft-nix.tar.gz
          retention-days: 14
          if-no-files-found: error

  # ----------------------------------------------------------------- guix ---
  # Per the Guix manual (Defining Packages): a classic package record on
  # gnu-build-system. Crates are vendored ahead of the build (`cargo
  # vendor`) so `guix build` stays offline (--frozen). The repo has NO
  # channel file, so `guix pull` below resolves current channels -- expect
  # ~15 min of pull before the actual build starts.
  guix:
    needs: [test-gate, web]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: app/dist
      - uses: dtolnay/rust-toolchain@stable
      - name: Vendor crates for the offline Guix build
        working-directory: app/src-tauri
        run: |
          cargo vendor vendor > .cargo-config
          mkdir -p .cargo
          mv .cargo-config .cargo/config.toml
          du -sh vendor
      - name: Install Guix (prebuilt binary + build users)
        run: |
          set -e
          # guix-install.sh normally lives on Savannah. On 2026-10-17 Savannah
          # was unreachable from the runner AND everywhere else (wget exit 8),
          # so: Savannah first, Codeberg mirror of the same file as fallback,
          # and a shebang check so an HTML error page never reaches sh.
          for url in \
            https://git.savannah.gnu.org/cgit/guix.git/plain/etc/guix-install.sh \
            https://codeberg.org/guix/guix/raw/branch/master/etc/guix-install.sh; do
            if curl -fsSL --retry 2 --retry-delay 3 --connect-timeout 10 \
                 --max-time 60 -o guix-install.sh "$url" \
                 && head -n 1 guix-install.sh | grep -q '^#!'; then
              echo "installer source: $url"
              break
            fi
            echo "source failed: $url" >&2
            rm -f guix-install.sh
          done
          test -s guix-install.sh
          yes | sudo sh guix-install.sh
      - name: Ensure guix-daemon is running (runners lack usable systemd)
        run: |
          if ! sudo systemctl is-active --quiet guix-daemon 2>/dev/null; then
            sudo sh -c 'nohup /var/guix/profiles/per-user/root/current-guix/bin/guix-daemon --build-users-group=guixbuild >/dev/null 2>&1 &'
            sleep 15
          fi
          sudo /var/guix/profiles/per-user/root/current-guix/bin/guix build --version
      - name: Guix pull (default channel; Codeberg mirror when Savannah is down)
        run: |
          set +e
          GUIX=/var/guix/profiles/per-user/root/current-guix/bin/guix
          if sudo "$GUIX" pull; then
            echo "guix pull: default (Savannah) channel OK"
          else
            echo "default channel pull failed (Savannah outage?) -- Codeberg mirror" >&2
            set -e
            # Same git history as Savannah, so the channel-intro
            # authentication still applies.
            sudo "$GUIX" pull --channels='((channel (inherit %default-guix-channel) (url "https://codeberg.org/guix/guix")))'
          fi
      - name: Build the package
        run: |
          set -e
          # bordeaux first: ci.guix.gnu.org was 502ing during the same
          # 2026-10-17 outage; listing both keeps the leg alive either way.
          OUT=$(sudo /root/.config/guix/current/bin/guix build \
                  --substitute-urls="https://bordeaux.guix.gnu.org https://ci.guix.gnu.org" \
                  -f guix.scm)
          echo "guix build output: $OUT"
          sudo tar -czf admincraft-guix.tar.gz -C / "$OUT"
          sudo chown "$(id -un):$(id -gn)" admincraft-guix.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: guix-out
          path: admincraft-guix.tar.gz
          retention-days: 14
          if-no-files-found: error

  # -------------------------------------------------------------- release ---
  # GitHub Release, cut automatically from a vX.Y.Z tag push. Needs all six
  # build legs (test-gate is transitive), so a release never ships from a
  # red or partial tree. Assets = this run's artifacts + the plugin
  # wheel/sdist built from the tagged source -- byte-for-byte the rules
  # that produced v0.1.0 manually (scripts/cut_v010_release.sh).
  # Job-level permissions: only this job gets contents:write, and only for
  # `gh release create` with the built-in GITHUB_TOKEN -- no PATs.
  # Manual fallback (if a tag ever fails to fire): dispatch a run on the
  # tag's commit, then re-assemble per AGENTS.md "Releases".
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, windows, linux, android, nix, guix]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build plugin wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build plugin
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble release assets (mirror of scripts/cut_v010_release.sh)
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p release
          mv plugin/dist/admincraft-*.whl plugin/dist/admincraft-*.tar.gz release/
          mv artifacts/nix-out/admincraft-nix.tar.gz "release/admincraft-$VERSION-nix.tar.gz"
          mv artifacts/guix-out/admincraft-guix.tar.gz "release/admincraft-$VERSION-guix.tar.gz"
          mv "$(find artifacts/windows-setup -name '*-setup.exe')" "release/admincraft_${VERSION}_x64-setup.exe"
          mv "$(find artifacts/linux-appimage -name '*.AppImage')" "release/admincraft_${VERSION}_amd64.AppImage"
          # apk: tauri android build --target aarch64,armv7 -> one universal
          # apk carrying lib/arm64-v8a + lib/armeabi-v7a, stable-signatured
          mv "$(find artifacts/android-apk -name '*.apk')" "release/admincraft-$VERSION-android-universal-debug.apk"
          webroot=artifacts/web-dist
          if [ -d "$webroot/dist" ]; then webroot="$webroot/dist"; fi
          test -f "$webroot/index.html"
          tar -czf "release/admincraft-$VERSION-web.tar.gz" -C "$webroot" .
          ( cd release && sha256sum * > SHA256SUMS.txt )
          ls -la release/
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "admincraft $GITHUB_REF_NAME" \
            --generate-notes
