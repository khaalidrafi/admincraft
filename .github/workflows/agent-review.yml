name: agent-review
# PARALLEL REVIEW TRACK (Owner order 2026-10-25 18:21Z "Run concurrent
# tasks in CI with branches. BOOST. SPEED UP."):
#   - One workflow_dispatch = one READ-ONLY duty review of ONE branch.
#   - Different branches run CONCURRENTLY (concurrency group is keyed
#     per-branch; the serialized chain in agent-team.yml is untouched
#     and stays the ONLY writer of ai/main).
#   - No push, no control-file write, no merge. The verdict lands in
#     the step summary + a review-verdict artifact (30-day retention).
#   - The Lead may execute a merge on such an APPROVED verdict per the
#     SEGREGATION law (merger=Lead via CI gate on duty-reviewer APPROVED
#     + Lead-measured full 11-leg landing gate), re-checking the diff
#     delta at merge time — a review is evidence against the main that
#     existed when it ran; staleness is the Lead's to re-verify.
#   - Reviewer: groq/qwen3.8-27b (duty reviewer since the 10-df
#     rotation; probe 200 ALIVE 18:17Z run 40220339780). The review
#     recipe mirrors the chain's: fast gate subset (pytest + check +
#     migrations, no vitest) + full diff + law checklist + a final
#     VERDICT token line.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Pending branch to review (e.g. ai/turn-20261024-2326)'
        required: true
      author:
        description: 'Authoring seat/role of the branch'
        required: true
        default: 'unknown'
      head_sha:
        description: 'Expected head sha (evidence contract, optional)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: review-${{ github.event.inputs.branch }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project deps
        run: |
          pip install -r demo-backend/requirements.txt pytest
          pip install -e plugin

      - name: Resolve branch head (evidence contract)
        id: head
        run: |
          BR="${{ github.event.inputs.branch }}"
          git fetch origin "$BR" --quiet
          SHA=$(git rev-parse --verify "origin/${BR#origin/}" 2>/dev/null || git rev-parse --verify "$BR")
          echo "resolved head: $SHA"
          WANT="${{ github.event.inputs.head_sha }}"
          if [ -n "$WANT" ] && [ "$SHA" != "$WANT" ]; then
            echo "::warning::head $SHA != expected $WANT — reviewing the PUSHED tip (the chain reviews what was pushed, never a laptop state)"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$BR" >> "$GITHUB_OUTPUT"

      - name: Fast gate subset (same recipe as the chain reviewer)
        id: gate
        run: |
          {
            echo "=== FAST GATE SUBSET ==="
            echo "SCOPE NOTE: measured on the MACHINERY tree (ai/main checkout), NOT on the reviewed branch — the branch's test delta (e.g. added tests raising 306->308) is NOT executed here; judge branch tests from the diff and the manifest only."
            echo "--- pytest (plugin/tests) ---"
            python3 -m pytest plugin/tests -p no:cacheprovider -q 2>&1 | tail -5
            echo "PYTEST_RC=${PIPESTATUS[0]}"
            echo "--- manage.py check ---"
            python3 demo-backend/manage.py check 2>&1 | tail -3
            echo "CHECK_RC=${PIPESTATUS[0]}"
            echo "--- makemigrations --check ---"
            python3 demo-backend/manage.py makemigrations --check 2>&1 | tail -3
            echo "MIGRATIONS_RC=${PIPESTATUS[0]}"
            echo "--- secret scan over the FULL diff (SECRET LAW pre-measure) ---"
            BR="${{ steps.head.outputs.branch }}"
            BASE=$(git merge-base origin/ai/main "origin/$BR")
            SECRET_HITS=$(git diff "$BASE"..."origin/$BR" | grep -Eci "github_pat_[A-Za-z0-9_]+|sk-[A-Za-z0-9]{20}|AKIA[0-9A-Z]{16}|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY" || true)
            echo "SECRET_SCAN_HITS=$SECRET_HITS (0 = clean; full diff scanned, not the truncated body)"
          } > gate-out.txt 2>&1
          cat gate-out.txt

      - name: Generate diff vs merge-base
        run: |
          BR="${{ steps.head.outputs.branch }}"
          BASE=$(git merge-base origin/ai/main "origin/$BR")
          echo "merge-base: $BASE"
          git diff "$BASE"..."origin/$BR" > review-diff.txt || true
          git diff --stat "$BASE"..."origin/$BR" | tail -3
          # size guard: keep the reviewer's REQUEST under groq's caps —
          # evidence: runs 40222194772/40222193160 hit HTTP 413 with a
          # 120KB diff inside the JSON payload; 48KB/29.5KB still 413'd;
          # artifacts review-verdict-9/-10 measured the FREE-TIER token
          # caps: ITPM=7000, OTPM=1000 (req_01m5t6nsa*/req_01m5t6p0*).
          # Cap the diff at 8KB: brief+diff+gate ~= 2.8K tokens < ITPM,
          # JSON body ~14KB < 413 threshold; reviewer flags PARTIAL REVIEW.
          MAX=8000
          if [ "$(wc -c < review-diff.txt)" -gt "$MAX" ]; then
            # run 40225779256 artifact evidence (first REAL verdict, v12):
            # the reviewer correctly REJECTED because the stat summary was
            # EMPTY — the trim block used "$BR" (a local branch name that
            # does not exist after fetch-depth:0; ea6dd86's same bug class)
            # so the stat command died silently. Fix: origin/ prefix + a
            # full --name-status manifest so the reviewer can verify the
            # no-Lead-owned-files law even when the diff body is truncated.
            {
              echo "=== FULL FILE MANIFEST (name-status, complete change) ==="
              git diff --name-status "$BASE"..."origin/$BR"
              echo "=== STAT TAIL ==="
              git diff --stat "$BASE"..."origin/$BR" | tail -5
              echo "=== DIFF BODY (first ${MAX} bytes) ==="
              git diff "$BASE"..."origin/$BR" | head -c "$MAX"
              echo ""
              echo "... [DIFF BODY TRUNCATED at ${MAX} bytes — the manifest above IS the complete file list; judge the no-Lead-files law on it; flag PARTIAL REVIEW for the hidden hunks]"
            } > review-diff-trim.txt
            mv review-diff-trim.txt review-diff.txt
          fi
          echo "diff bytes: $(wc -c < review-diff.txt)"

      - name: Duty reviewer verdict (single-shot groq, free-tier-limits-aware)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BR_NAME: ${{ steps.head.outputs.branch }}
          BR_AUTHOR: ${{ github.event.inputs.author }}
          BR_SHA: ${{ steps.head.outputs.sha }}
        run: |
          # MEASURED PROVIDER LIMITS (artifacts review-verdict-9/-10, runs
          # 40223485958/40223488282, req_01m5t6nsa*/req_01m5t6p0*): groq
          # free on_demand tier for qwen/qwen3.8-27b enforces OTPM=1000
          # (goose requested 2048 -> rejected) and ITPM=7000 (goose's own
          # system+tools prompt alone requested 22878 -> rejected). The
          # agentic goose recipe CANNOT fit this tier — receipts above.
          # FIX: single-shot chat call, max_tokens=900 (< OTPM), micro
          # body: brief + 8KB diff + 2KB gate excerpt ~= 2.8K tokens
          # (< ITPM); JSON body ~14KB also clears the measured 413
          # threshold (~29.5KB failed). Not agentic: the harness
          # pre-measures the gate; the reviewer judges DIFF + LAW and
          # flags PARTIAL REVIEW when the diff was truncated.
          python3 - <<'PYEOF'
          import json, os
          diff = open("review-diff.txt", encoding="utf-8", errors="replace").read()
          gate = open("gate-out.txt", encoding="utf-8", errors="replace").read()[:2000]
          sysmsg = (
              "You are the DUTY REVIEWER (QA Engineer; SEGREGATION LAW v2: author, reviewer and merger are SEPARATE roles). "
              "Read-only duty review of one pending branch. Law checklist: no secrets in the diff (SECRET LAW); "
              "no Lead-owned files edited (.github/workflows/*, agent-team/TEAM-CONTROL.org, .github/scripts/*, .gitattributes); "
              "board flips carry :DELIVERED: evidence with branch + sha; TEAM-CHAT entries in legal format. "
              "If the author is quality-assurance-engineer or visiting-engineer (same role as you), the verdict is REJECTED (reason: reviewer-equals-author). "
              "If the diff was truncated, open with PARTIAL REVIEW and judge the visible hunks plus the stat summary. "
              "BUDGET LAW (v15 evidence: run 40226344420 wrote a full 5-section analysis and the 900-token cap cut it BEFORE the verdict -> review-missing): "
              "answer in UNDER 250 WORDS. The FIRST line of your answer MUST be exactly one of:\n"
              "VERDICT: APPROVED\n"
              "VERDICT: REJECTED - <one line of reasons>\n"
              "AFTER the verdict line give at most 4 short bullet reasons (law checks, gate evidence, code risks). Nothing else.")
          usrmsg = (
              "Pending branch: " + os.environ.get("BR_NAME", "") +
              " (authored by " + os.environ.get("BR_AUTHOR", "") + ", head " + os.environ.get("BR_SHA", "") + ").\n\n"
              "PRE-MEASURED GATE EVIDENCE from the harness (fast subset):\n" + gate + "\n\n"
              "DIFF (may be truncated; the stat lines cover the full change):\n" + diff + "\n\n"
              "Deliver the duty review now, ending with the VERDICT line.")
          payload = {"model": "qwen/qwen3.8-27b", "temperature": 0, "max_tokens": 900,
                     "messages": [{"role": "system", "content": sysmsg},
                                  {"role": "user", "content": usrmsg}]}
          open("groq-payload.json", "w").write(json.dumps(payload))
          print("JSON body bytes:", len(json.dumps(payload)))
          PYEOF
          # SEND via curl (run 40225511333 evidence: python-urllib got a
          # bare 403 Forbidden x2 — WAF/UA filtering suspected; curl UA +
          # a named User-Agent is the standard fix) and CAPTURE THE BODY
          # on any non-200 so the artifact self-diagnoses the provider.
          send_groq() {
            curl -sS -o groq-resp.json -w "%{http_code}" --max-time 120 \
              -X POST "https://api.groq.com/openai/v1/chat/completions" \
              -H "Authorization: Bearer $GROQ_API_KEY" \
              -H "Content-Type: application/json" \
              -H "User-Agent: admincraft-duty-reviewer/1.0" \
              --data @groq-payload.json 2>groq-curlerr.txt || echo "CURLERR"
          }
          CODE=$(send_groq)
          echo "groq http code (attempt 1): $CODE"
          if [ "$CODE" != "200" ]; then
            { echo "transport-failed: http $CODE"; cat groq-curlerr.txt; echo "--- response body ---"; head -c 2000 groq-resp.json; } > review-out.txt
            sleep 20
            CODE=$(send_groq)
            echo "groq http code (attempt 2): $CODE"
            if [ "$CODE" != "200" ]; then
              { echo "transport-failed x2: http $CODE"; cat groq-curlerr.txt; echo "--- response body ---"; head -c 2000 groq-resp.json; } >> review-out.txt
            fi
          fi
          if [ "$CODE" = "200" ]; then
            python3 -c "import json; open('review-out.txt','w').write(json.load(open('groq-resp.json'))['choices'][0]['message']['content'])"
            echo "groq ok, verdict bytes: $(wc -c < review-out.txt)"
          fi
          tail -5 review-out.txt
          grep -E "^VERDICT:" review-out.txt | tail -1 || echo "NO VERDICT TOKEN (review-missing)"

      - name: Record verdict
        run: |
          VERDICT=$(grep -E "^VERDICT:" review-out.txt | tail -1 || echo "VERDICT: MISSING — review-missing (no token)")
          {
            echo "## Parallel review verdict — ${{ steps.head.outputs.branch }}"
            echo ""
            echo "- head: ${{ steps.head.outputs.sha }}"
            echo "- author: ${{ github.event.inputs.author }}"
            echo "- reviewer: groq/qwen3.8-27b (parallel track, dispatch ${{ github.run_id }})"
            echo "- **$VERDICT**"
            echo ""
            echo "<details><summary>full reviewer output</summary>"
            echo ""
            echo '```'
            cat review-out.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: review-verdict-${{ github.run_number }}
          path: |
            review-out.txt
            review-diff.txt
            gate-out.txt
          retention-days: 30
