name: agent-review
# PARALLEL REVIEW TRACK (Owner order 2026-10-25 18:21Z "Run concurrent
# tasks in CI with branches. BOOST. SPEED UP."):
#   - One workflow_dispatch = one READ-ONLY duty review of ONE branch.
#   - Different branches run CONCURRENTLY (concurrency group is keyed
#     per-branch; the serialized chain in agent-team.yml is untouched
#     and stays the ONLY writer of ai/main).
#   - No push, no control-file write, no merge. The verdict lands in
#     the step summary + a review-verdict artifact (30-day retention).
#   - The Lead may execute a merge on such an APPROVED verdict per the
#     SEGREGATION law (merger=Lead via CI gate on duty-reviewer APPROVED
#     + Lead-measured full 11-leg landing gate), re-checking the diff
#     delta at merge time — a review is evidence against the main that
#     existed when it ran; staleness is the Lead's to re-verify.
#   - Reviewer: groq/qwen3.8-27b (duty reviewer since the 10-df
#     rotation; probe 200 ALIVE 18:17Z run 40220339780). The review
#     recipe mirrors the chain's: fast gate subset (pytest + check +
#     migrations, no vitest) + full diff + law checklist + a final
#     VERDICT token line.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Pending branch to review (e.g. ai/turn-20261024-2326)'
        required: true
      author:
        description: 'Authoring seat/role of the branch'
        required: true
        default: 'unknown'
      head_sha:
        description: 'Expected head sha (evidence contract, optional)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: review-${{ github.event.inputs.branch }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project deps
        run: |
          pip install -r demo-backend/requirements.txt pytest
          pip install -e plugin

      - name: Resolve branch head (evidence contract)
        id: head
        run: |
          BR="${{ github.event.inputs.branch }}"
          git fetch origin "$BR" --quiet
          SHA=$(git rev-parse --verify "origin/${BR#origin/}" 2>/dev/null || git rev-parse --verify "$BR")
          echo "resolved head: $SHA"
          WANT="${{ github.event.inputs.head_sha }}"
          if [ -n "$WANT" ] && [ "$SHA" != "$WANT" ]; then
            echo "::warning::head $SHA != expected $WANT — reviewing the PUSHED tip (the chain reviews what was pushed, never a laptop state)"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$BR" >> "$GITHUB_OUTPUT"

      - name: Fast gate subset (same recipe as the chain reviewer)
        id: gate
        run: |
          {
            echo "=== FAST GATE SUBSET ==="
            echo "--- pytest (plugin/tests) ---"
            python3 -m pytest plugin/tests -p no:cacheprovider -q 2>&1 | tail -5
            echo "PYTEST_RC=$?"
            echo "--- manage.py check ---"
            python3 demo-backend/manage.py check 2>&1 | tail -3
            echo "CHECK_RC=$?"
            echo "--- makemigrations --check ---"
            python3 demo-backend/manage.py makemigrations --check 2>&1 | tail -3
            echo "MIGRATIONS_RC=$?"
          } > gate-out.txt 2>&1
          cat gate-out.txt

      - name: Generate diff vs merge-base
        run: |
          BR="${{ steps.head.outputs.branch }}"
          BASE=$(git merge-base origin/ai/main "origin/$BR")
          echo "merge-base: $BASE"
          git diff "$BASE"..."origin/$BR" > review-diff.txt || true
          git diff --stat "$BASE"..."origin/$BR" | tail -3
          # size guard: keep the reviewer's REQUEST under groq's cap —
          # evidence: runs 40222194772/40222193160 hit HTTP 413 with a
          # 120KB diff inside the JSON payload (Lead 10-dk). Cap the
          # diff at 48KB with the stat preamble covering the full change.
          MAX=48000
          if [ "$(wc -c < review-diff.txt)" -gt "$MAX" ]; then
            {
              git diff --stat "$BASE"..."$BR" | tail -5
              git diff "$BASE"..."$BR" | head -c "$MAX"
              echo ""
              echo "... [DIFF TRUNCATED at ${MAX} bytes — stat above covers the full change; reviewer must flag PARTIAL REVIEW in the verdict body]"
            } > review-diff-trim.txt
            mv review-diff-trim.txt review-diff.txt
          fi
          echo "diff bytes: $(wc -c < review-diff.txt)"

      - name: Duty reviewer verdict (agentic groq/qwen3.8-27b@goose — the chain recipe)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # 413 ROOT CAUSE (runs 40222194772/40222193160/4022300*/4022310*):
          # groq rejects LARGE single-shot chat bodies (~30KB+ JSON) with
          # HTTP 413 — a diff-in-prompt review cannot fit. FIX: use the
          # CHAIN'S PROVEN AGENTIC RECIPE (goose + groq env override, the
          # same one running the 2244 review in agent-team.yml right now):
          # small per-turn requests, the reviewer runs git/pytest itself.
          # Goose binary + the team's OWN baked config (Owner order
          # 2026-10-20 "make agent configs, too, and reuse them").
          mkdir -p /tmp/goose-dl \
            && curl -fsSL -o /tmp/goose-dl/goose.tar.bz2 \
                 https://github.com/block/goose/releases/download/stable/goose-x86_64-unknown-linux-gnu.tar.bz2 \
            && tar -xjf /tmp/goose-dl/goose.tar.bz2 -C /tmp/goose-dl \
            && install -m 0755 /tmp/goose-dl/goose /usr/local/bin/goose
          mkdir -p "$HOME/.config/goose"
          cp docker/harness/goose-config.yaml "$HOME/.config/goose/config.yaml"
          git config --global --add safe.directory "$PWD"
          BR="${{ steps.head.outputs.branch }}"
          AUTHOR="${{ github.event.inputs.author }}"
          SHA="${{ steps.head.outputs.sha }}"
          GATE=$(head -c 2000 gate-out.txt)
          REVIEW_BRIEF="REVIEW DUTY (SEGREGATION LAW v2, Owner 18:14Z + 18:55Z: duties belong to capable member roles — author, reviewer and merger are SEPARATE roles; no seat merges its own work).
          You are the DUTY REVIEWER: QA Engineer, member groq/qwen3.8-27b@goose (parallel review track — read-only; the serialized chain remains the only merger).
          Pending branch: ${BR} (authored by ${AUTHOR}, head ${SHA}).
          If the author is the SAME member role as you (quality-assurance-engineer or visiting-engineer), your verdict is REJECTED (reason: reviewer-equals-author).
          Do this READ-ONLY, in order:
          1. git fetch origin ${BR} ; git log --oneline origin/ai/main..origin/${BR}
          2. git diff origin/ai/main...origin/${BR} — read EVERY hunk.
          3. FAST gate subset ONLY (python3 exists here, pytest is installed): python3 -m pytest plugin/tests -p no:cacheprovider -q ; python3 demo-backend/manage.py check ; python3 demo-backend/manage.py makemigrations --check — report each rc. Do NOT run vitest/npx/tsc: FE execution is graded by the CI test job on the merge and re-run by the Lead's finalize gate — your duty is the DIFF + LAW review. If a check cannot start, report rc CANNOT and move on — NEVER loop on environment repair.
          4. Law check: no secrets in the diff (SECRET LAW); no Lead-owned files edited (.github/workflows/*, agent-team/TEAM-CONTROL.org, .github/scripts/*, .gitattributes); the board flip carries :DELIVERED: evidence with branch + sha; TEAM-CHAT entries legal format.
          5. Do NOT modify or commit anything — your verdict text is your whole deliverable.
          6. The LAST line of your answer MUST be exactly one of:
          VERDICT: APPROVED
          VERDICT: REJECTED — <one line of reasons>
          PRE-MEASURED GATE EVIDENCE from the harness (corroborate if you wish):
          ${GATE}"
          env HOME="$HOME" GOOSE_PROVIDER=openai GOOSE_MODEL=qwen/qwen3.8-27b \
               OPENAI_API_KEY="$GROQ_API_KEY" \
               OPENAI_HOST="https://api.groq.com" \
               OPENAI_BASE_PATH="/openai/v1/chat/completions" \
               timeout 900 goose run --no-session -t "$REVIEW_BRIEF" \
               > review-out.txt 2>&1 || true
          tail -5 review-out.txt
          grep -E "^VERDICT:" review-out.txt | tail -1 || echo "NO VERDICT TOKEN (review-missing)"

      - name: Record verdict
        run: |
          VERDICT=$(grep -E "^VERDICT:" review-out.txt | tail -1 || echo "VERDICT: MISSING — review-missing (no token)")
          {
            echo "## Parallel review verdict — ${{ steps.head.outputs.branch }}"
            echo ""
            echo "- head: ${{ steps.head.outputs.sha }}"
            echo "- author: ${{ github.event.inputs.author }}"
            echo "- reviewer: groq/qwen3.8-27b (parallel track, dispatch ${{ github.run_id }})"
            echo "- **$VERDICT**"
            echo ""
            echo "<details><summary>full reviewer output</summary>"
            echo ""
            echo '```'
            cat review-out.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: review-verdict-${{ github.run_number }}
          path: |
            review-out.txt
            review-diff.txt
            gate-out.txt
          retention-days: 30
